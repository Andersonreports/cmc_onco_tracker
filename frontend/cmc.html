<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMC Trackers · Anderson Trackings</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --accent: #0d9488;
      --accent-hover: #0f766e;
      --accent-light: #5eead4;
      --accent-glow: rgba(13, 148, 136, 0.20);
      --main-bg: #f0faf7;
      --card-bg: #ffffff;
      --text-main: #0c3528;
      --text-muted: #4a7a6d;
      --border: #b2e4d9;
      --border-strong: #6dc8b8;
      --sidebar-bg: #0f2542;
      --shadow: 0 2px 16px rgba(14, 79, 64, 0.10);
      --shadow-md: 0 4px 24px rgba(14, 79, 64, 0.13);
      --shadow-lg: 0 8px 40px rgba(14, 79, 64, 0.16);
      --tr: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--main-bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* === HERO BAND (photo background, fades into page) === */
    .hero-band {
      position: relative;
      overflow: hidden;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .hero-band::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
        url('/hero-bg.png');
      background-size: cover, cover;
      background-position: center, center;
      background-repeat: no-repeat, no-repeat;
    }

    .hero-band .backbar,
    .hero-band .hero,
    .hero-band .grid {
      position: relative;
      z-index: 2;
    }

    /* === TOP HEADER === */
    .app-header {
      position: relative;
      z-index: 2;
      height: 64px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 32px;
      background: var(--sidebar-bg);
      color: #fff;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
    }

    .app-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.12);
      color: var(--accent-light);
    }

    .app-logo [data-lucide] {
      width: 22px;
      height: 22px;
    }

    .app-header .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .app-header .brand span {
      font-weight: 400;
      color: var(--accent-light);
    }

    .app-header .spacer { flex: 1; }

    .logout-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13.5px;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      transition: var(--tr);
    }

    .logout-btn:hover { background: rgba(255, 255, 255, 0.22); }
    .logout-btn [data-lucide] { width: 16px; height: 16px; }

    /* === BACK LINK === */
    .backbar {
      flex-shrink: 0;
      max-width: 1160px;
      width: 100%;
      margin: 0 auto;
      padding: 22px 32px 0;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.92);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 999px;
      transition: var(--tr);
    }

    .back-link:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }

    .back-link [data-lucide] {
      width: 16px;
      height: 16px;
    }

    /* === HERO === */
    .hero {
      flex-shrink: 0;
      text-align: center;
      padding: 24px 24px 8px;
    }

    .hero h1 {
      font-size: clamp(30px, 5vw, 46px);
      font-weight: 800;
      letter-spacing: -1px;
      color: #ffffff;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55), 0 1px 4px rgba(0, 0, 0, 0.45);
    }

    .hero p {
      margin-top: 14px;
      font-size: 16px;
      color: var(--text-muted);
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
    }

    /* === GRID === */
    .grid {
      flex: 1;
      display: grid;
      align-content: start;
      grid-template-columns: repeat(auto-fit, minmax(280px, 340px));
      justify-content: center;
      gap: 24px;
      max-width: 1160px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 32px 72px;
    }

    .card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 26px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 210px;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow);
      transition: var(--tr);
      overflow: hidden;
    }

    .card.active {
      cursor: pointer;
    }

    .card.active:hover {
      transform: translateY(-6px);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-lg);
    }

    .card.active::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
    }

    .card .icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: #fff;
      box-shadow: 0 6px 18px var(--accent-glow);
    }

    .card .icon [data-lucide] {
      width: 26px;
      height: 26px;
    }

    .card h3 {
      font-size: 19px;
      font-weight: 700;
    }

    .card .desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      flex: 1;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      align-self: flex-start;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
    }

    .badge [data-lucide] {
      width: 14px;
      height: 14px;
    }

    .badge.live {
      background: rgba(22, 163, 74, 0.12);
      color: #16a34a;
    }

    .badge.soon {
      background: rgba(74, 122, 109, 0.12);
      color: var(--text-muted);
    }

    /* === PLACEHOLDER CARDS === */
    .card.placeholder {
      border-style: dashed;
      background: rgba(255, 255, 255, 0.55);
      box-shadow: none;
    }

    .card.placeholder .icon {
      background: var(--border);
      color: var(--text-muted);
      box-shadow: none;
    }

    .card.placeholder h3 {
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      .app-header { padding: 0 18px; }
      .backbar { padding: 18px 18px 0; }
      .grid { padding: 28px 18px 56px; }
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="app-logo"><i data-lucide="microscope"></i></div>
    <div class="brand">Anderson <span>Trackings</span></div>
    <div class="spacer"></div>
    <a class="logout-btn" href="/auth/logout"><i data-lucide="log-out"></i> Sign out</a>
  </header>

  <div class="hero-band">
    <nav class="backbar">
      <a class="back-link" href="/" id="back-link"><i data-lucide="arrow-left"></i> Back</a>
    </nav>

    <section class="hero">
      <h1>CMC Trackers</h1>
    </section>

    <main class="grid">
      <!-- CMC ONCO Tracker — LIVE -->
      <a class="card active" href="../cmc-onco/">
        <div class="icon"><i data-lucide="microscope"></i></div>
        <h3>CMC ONCO Tracker</h3>
        <span class="badge live"><i data-lucide="circle-dot"></i> Live</span>
      </a>

    </main>
  </div>

  <script>
    lucide.createIcons();
    // Back button: use real browser-back when we arrived from within the app,
    // otherwise follow the href to the parent page.
    document.getElementById('back-link').addEventListener('click', function (e) {
      const sameOrigin = document.referrer && new URL(document.referrer).origin === location.origin;
      if (sameOrigin && history.length > 1) {
        e.preventDefault();
        history.back();
      }
    });
  </script>
</body>

</html>
