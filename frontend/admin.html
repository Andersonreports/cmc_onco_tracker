<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management · Anderson Trackings</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --accent: #0d9488;
      --accent-hover: #0f766e;
      --accent-light: #5eead4;
      --accent-glow: rgba(13, 148, 136, 0.20);
      --main-bg: #f0faf7;
      --card-bg: #ffffff;
      --text-main: #0c3528;
      --text-muted: #4a7a6d;
      --border: #b2e4d9;
      --border-strong: #6dc8b8;
      --sidebar-bg: #0e4f40;
      --danger: #dc2626;
      --shadow: 0 2px 16px rgba(14, 79, 64, 0.10);
      --shadow-lg: 0 8px 40px rgba(14, 79, 64, 0.16);
      --tr: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(94, 234, 212, 0.28), transparent 60%),
        radial-gradient(1000px 500px at 100% 0%, rgba(13, 148, 136, 0.14), transparent 55%),
        var(--main-bg);
      color: var(--text-main);
      min-height: 100vh;
    }

    /* Header */
    .app-header {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 32px;
      background: var(--sidebar-bg);
      color: #fff;
      box-shadow: 0 4px 24px rgba(14, 79, 64, 0.13);
    }
    .app-logo {
      width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
      background: rgba(255, 255, 255, 0.12); color: var(--accent-light);
    }
    .app-logo [data-lucide] { width: 22px; height: 22px; }
    .app-header .brand { font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
    .app-header .brand span { font-weight: 400; color: var(--accent-light); }
    .app-header .spacer { flex: 1; }
    .hbtn {
      display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600;
      color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.12); transition: var(--tr); border: none; cursor: pointer; font-family: inherit;
    }
    .hbtn:hover { background: rgba(255, 255, 255, 0.22); }
    .hbtn [data-lucide] { width: 16px; height: 16px; }

    /* Page */
    .wrap { max-width: 1000px; margin: 0 auto; padding: 40px 32px 72px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .page-head h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.6px; }
    .page-head p { margin-top: 6px; font-size: 14px; color: var(--text-muted); max-width: 620px; line-height: 1.55; }

    .btn {
      display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border-radius: 10px;
      font-size: 13.5px; font-weight: 600; border: 1px solid transparent; cursor: pointer;
      font-family: inherit; transition: var(--tr);
    }
    .btn [data-lucide] { width: 16px; height: 16px; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-hover)); color: #fff; }
    .btn-primary:hover { filter: brightness(1.05); box-shadow: 0 6px 18px var(--accent-glow); }
    .btn-outline { background: #fff; color: var(--text-main); border-color: var(--border-strong); }
    .btn-outline:hover { background: #f4fbf9; }
    .btn-danger { background: #fff; color: var(--danger); border-color: #f3b6b6; }
    .btn-danger:hover { background: #fef2f2; }
    .btn-sm { padding: 7px 10px; font-size: 12.5px; }

    .banner {
      display: none; align-items: flex-start; gap: 10px; padding: 13px 16px; border-radius: 10px;
      margin-bottom: 20px; font-size: 13px; line-height: 1.5;
      background: #fef2f2; border: 1px solid #f3b6b6; color: #b91c1c;
    }
    .banner.show { display: flex; }
    .banner [data-lucide] { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }

    .card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; box-shadow: var(--shadow);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    thead th {
      text-align: left; padding: 13px 18px; background: #f4fbf9; border-bottom: 1px solid var(--border);
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted);
    }
    tbody td { padding: 14px 18px; border-bottom: 1px solid #eaf5f1; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fdfb; }
    .muted { color: var(--text-muted); font-style: italic; }
    .pill {
      display: inline-flex; align-items: center; padding: 4px 11px; border-radius: 999px;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
    }
    .pill-admin { background: #e7f0ff; color: #2563eb; }
    .pill-cmc { background: #e6f7f2; color: var(--accent-hover); }
    .pill-anderson { background: #f3ecff; color: #7c3aed; }
    .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .empty-row { text-align: center; padding: 44px 16px; color: var(--text-muted); font-size: 13.5px; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(12, 53, 40, 0.45); z-index: 500;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #fff; border-radius: var(--radius); padding: 28px; width: 100%; max-width: 440px;
      box-shadow: var(--shadow-lg);
    }
    .modal-box h3 { font-size: 18px; font-weight: 800; margin-bottom: 18px; }
    .field { margin-bottom: 15px; }
    .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
    .field input, .field select {
      width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 9px;
      font-size: 14px; font-family: inherit; color: var(--text-main); background: #f8fdfb; outline: none; transition: var(--tr);
    }
    .field input:focus, .field select:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-glow); }
    .field input:disabled { background: #eef4f2; color: var(--text-muted); }
    .field-hint { font-size: 11.5px; color: var(--text-muted); margin-top: 5px; line-height: 1.45; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }

    .toast { position: fixed; bottom: 24px; right: 24px; z-index: 600; display: flex; flex-direction: column; gap: 8px; }
    .toast-item {
      padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; color: #fff;
      box-shadow: var(--shadow-lg); animation: toastIn 0.2s ease;
    }
    .toast-item.success { background: var(--accent-hover); }
    .toast-item.error { background: var(--danger); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 600px) {
      .app-header { padding: 0 18px; }
      .wrap { padding: 28px 16px 56px; }
      thead th:nth-child(2), tbody td:nth-child(2) { display: none; } /* hide mobile col on small screens */
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="app-logo"><i data-lucide="activity-square"></i></div>
    <div class="brand">Anderson <span>Trackings</span></div>
    <div class="spacer"></div>
    <a class="hbtn" href="/"><i data-lucide="arrow-left"></i> Dashboard</a>
    <a class="hbtn" href="/auth/logout"><i data-lucide="log-out"></i> Sign out</a>
  </header>

  <div class="wrap">
    <div class="page-head">
      <div>
        <h1>User Management</h1>
      </div>
      <button class="btn btn-primary" id="addBtn"><i data-lucide="user-plus"></i> Add user</button>
    </div>

    <div class="banner" id="errorBanner">
      <i data-lucide="alert-circle"></i>
      <span id="errorBannerText"></span>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Mobile number</th>
            <th>Role</th>
            <th style="text-align:right;">Actions</th>
          </tr>
        </thead>
        <tbody id="usersBody">
          <tr><td colspan="4" class="empty-row">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Add / Edit modal -->
  <div class="modal-overlay" id="userModal">
    <div class="modal-box">
      <h3 id="modalTitle">Add user</h3>
      <form id="userForm">
        <div class="field">
          <label for="f_name">Name</label>
          <input type="text" id="f_name" placeholder="e.g. Dr. Ravi Kumar" autocomplete="off">
        </div>
        <div class="field">
          <label for="f_mobile">Mobile number</label>
          <input type="tel" id="f_mobile" inputmode="numeric" maxlength="10" pattern="[0-9]{10}"
                 placeholder="10-digit mobile number" autocomplete="off" required>
          <div class="field-hint">Must match the mobile number IT has for this person — that's what verifies their identity at login.</div>
        </div>
        <div class="field">
          <label for="f_role">Role</label>
          <select id="f_role"></select>
          <div class="field-hint">Admin = all suites + this page · CMC = CMC trackers · Anderson = Anderson trackers.</div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toastWrap"></div>

  <script>
    lucide.createIcons();
    const $ = (id) => document.getElementById(id);
    const ROLE_LABELS = { admin: 'Admin', cmc: 'CMC', anderson: 'Anderson' };
    let ROLES = ['admin', 'cmc', 'anderson'];
    let editingMobile = null;   // non-null when editing an existing row

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function toast(msg, type) {
      const el = document.createElement('div');
      el.className = 'toast-item ' + (type || 'success');
      el.textContent = msg;
      $('toastWrap').appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    function showError(msg) {
      $('errorBannerText').textContent = msg;
      $('errorBanner').classList.add('show');
    }

    async function api(method, path, body) {
      const opts = { method, headers: {} };
      if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      const r = await fetch(path, opts);
      if (r.status === 401) { window.location.href = '/login'; throw new Error('Not signed in'); }
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.detail || ('Request failed (' + r.status + ')'));
      return d;
    }

    function roleOptions(selected) {
      return ROLES.map(r => `<option value="${r}" ${r === selected ? 'selected' : ''}>${ROLE_LABELS[r] || r}</option>`).join('');
    }

    function rolePill(role) {
      const cls = role === 'admin' ? 'pill-admin' : role === 'cmc' ? 'pill-cmc' : 'pill-anderson';
      return `<span class="pill ${cls}">${esc(ROLE_LABELS[role] || role)}</span>`;
    }

    let USERS = [];

    function render() {
      const body = $('usersBody');
      if (!USERS.length) {
        body.innerHTML = '<tr><td colspan="4" class="empty-row">No users yet — click "Add user" to grant someone access.</td></tr>';
        return;
      }
      body.innerHTML = USERS.map(u => `
        <tr>
          <td>${u.name ? `<strong>${esc(u.name)}</strong>` : '<span class="muted">—</span>'}</td>
          <td>${esc(u.mobile)}</td>
          <td>${rolePill(u.role)}</td>
          <td>
            <div class="row-actions">
              <button class="btn btn-outline btn-sm" data-edit="${esc(u.mobile)}" title="Edit"><i data-lucide="pencil"></i></button>
              <button class="btn btn-danger btn-sm" data-del="${esc(u.mobile)}" title="Remove"><i data-lucide="trash-2"></i></button>
            </div>
          </td>
        </tr>`).join('');
      lucide.createIcons();
      body.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEdit(b.dataset.edit)));
      body.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => remove(b.dataset.del)));
    }

    async function load() {
      try {
        const d = await api('GET', '/admin/users');
        ROLES = d.roles && d.roles.length ? d.roles : ROLES;
        USERS = d.users || [];
        $('errorBanner').classList.remove('show');
        render();
      } catch (e) {
        showError(e.message);
        $('usersBody').innerHTML = '<tr><td colspan="4" class="empty-row">—</td></tr>';
      }
    }

    function openAdd() {
      editingMobile = null;
      $('modalTitle').textContent = 'Add user';
      $('f_name').value = '';
      $('f_mobile').value = '';
      $('f_mobile').disabled = false;
      $('f_role').innerHTML = roleOptions('cmc');
      $('userModal').classList.add('open');
      $('f_mobile').focus();
    }

    function openEdit(mobile) {
      const u = USERS.find(x => x.mobile === mobile);
      if (!u) return;
      editingMobile = mobile;
      $('modalTitle').textContent = 'Edit user';
      $('f_name').value = u.name || '';
      $('f_mobile').value = u.mobile;
      $('f_mobile').disabled = true;   // mobile is the key; change = add a new one
      $('f_role').innerHTML = roleOptions(u.role);
      $('userModal').classList.add('open');
      $('f_name').focus();
    }

    function closeModal() { $('userModal').classList.remove('open'); }

    async function remove(mobile) {
      const u = USERS.find(x => x.mobile === mobile);
      const who = u && u.name ? `${u.name} (${mobile})` : mobile;
      if (!window.confirm(`Remove access for ${who}? This cannot be undone.`)) return;
      try {
        await api('DELETE', '/admin/users/' + encodeURIComponent(mobile));
        toast('User removed.', 'success');
        load();
      } catch (e) { toast(e.message, 'error'); }
    }

    $('addBtn').addEventListener('click', openAdd);
    $('cancelBtn').addEventListener('click', closeModal);
    $('userModal').addEventListener('click', e => { if (e.target.id === 'userModal') closeModal(); });
    $('f_mobile').addEventListener('input', e => { e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 10); });

    $('userForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = $('f_name').value.trim();
      const mobile = editingMobile || $('f_mobile').value.trim();
      const role = $('f_role').value;
      if (!/^[0-9]{10}$/.test(mobile)) { toast('Enter a valid 10-digit mobile number.', 'error'); return; }
      try {
        await api('POST', '/admin/users', { mobile, name, role });
        toast(editingMobile ? 'User updated.' : 'User added.', 'success');
        closeModal();
        load();
      } catch (err) { toast(err.message, 'error'); }
    });

    load();
  </script>
</body>

</html>
