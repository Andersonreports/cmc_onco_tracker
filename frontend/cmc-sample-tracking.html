        let currentTableCols = []; // Track column definitions for current table to enable correct sorting.

        function renderTable(rows, title = '', headers = null, statRows = null) {
            if (rows.length === 0) {
                document.getElementById('contentArea').innerHTML = '<div class="no-data">No samples match your criteria</div>';
                return;
            }
            
            const normalize = (str) => String(str).toLowerCase().replace(/[^a-z0-9]/g, '');
            const allKeys = Object.keys(rows[0]).filter(key => key !== '_sourceSheet');

            // Pre-detect the client department column by scanning actual cell VALUES.
            // This works regardless of what the column is named in the spreadsheet.
            const CLIENT_DEPT_KW = ['CHRISTIAN MEDICAL','HAEMOTOL','HAEMATOL','NEPHROL',
                                    'CYTOGENET','MEDICAL GENET','MOLECULAR ENDOCRIN',
                                    'CMC VELLORE','CMC -','CMC-'];
            const isDeptValue = v => {
                const u = String(v||'').trim().toUpperCase();
                return u.length > 3 && u.length < 150 && CLIENT_DEPT_KW.some(kw => u.includes(kw));
            };
            // Find column key whose values look like department names (check first 20 rows)
            const clientDeptKey = (() => {
                const sample = rows.slice(0, 20);
                // Prefer a key that normalises to 'clientdepartment', then 'clientname'
                const priority = allKeys.slice().sort((a,b) => {
                    const order = ['clientdepartment','clientname','client','department'];
                    const ia = order.indexOf(normalize(a)), ib = order.indexOf(normalize(b));
                    return (ia<0?99:ia) - (ib<0?99:ib);
                });
                for (const k of priority) {
                    if (sample.some(r => isDeptValue(r[k]))) return k;
                }
                // Fallback: any column whose values contain department keywords
                for (const k of allKeys) {
                    if (sample.some(r => isDeptValue(r[k]))) return k;
                }
                return null;
            })();
            
            const definitions = {
                sampleName: { title: 'Sample Name', keys: ['samplename', 'patientname', 'name', 'patient', 'patientsamplename'] },
                gender: { title: 'Gender', keys: ['gender', 'sex', 'mf'] },
                age: { title: 'Age', keys: ['age', 'patientage'] },
                andId: { title: 'Anderson ID', keys: ['andid', 'andersonid'] },
                sampleNumber: { title: 'Sample Number', keys: ['samplenumber', 'sampleno', 'sampleid', 'labnumber', 'labid', 'labno', 'barcode', 'uhid'] },
                test: { title: 'Test', keys: ['test', 'testname', 'testformat', 'testtype', 'assay', 'analysis', 'procedure'] },
                clientDept: { title: 'Client Department', keys: ['clientdepartment', 'clientname', 'client', 'department', 'referral', 'refby', 'referredby', 'referringhospital', 'referringdoctor', 'hospital', 'hospitalname', 'centername', 'center', 'clinic', 'account', 'customer', 'source'] },
                remarks: { title: 'Remarks', keys: ['remarks', 'remark', 'comments', 'comment', 'notes', 'history'] },
                receivedDate: { title: 'Received Date', keys: ['receiveddate', 'datereceived', 'receiptdate', 'registrationdate', 'regdate', 'inwarddate', 'entrydate', 'bookingdate', 'received', 'dateofreceiptt'] },
                rawDataDate: { title: 'Raw Data Sent', keys: ['rawdatadate', 'rawdatasent', 'rawdata', 'rundate', 'sequencingdate', 'rawdatareceived', 'datasentdate', 'rawdatasentdate'] },
                tatRawData: { title: 'TAT Raw Data', keys: ['tatrawdata', 'tatrawdate', 'tatdataraw', 'rawdatatat', 'tatraw', 'tatdata', 'tattodataraw'] },
                tatReportDate: { title: 'TAT Report Date', keys: ['tatreportdate', 'tatreport', 'tatdate', 'duedate', 'targetdate', 'promiseddate', 'tat'] },
                reportReleasedDate: { title: 'Report Released Date', keys: ['reportreleaseddate', 'reportreleased', 'releaseddate', 'releasedate', 'dispatchdate', 'completiondate', 'finalreport', 'issueddate'] },
                status: { title: 'Status', keys: ['status', 'samplestatus', 'reportstatus', 'processstatus', 'currentstatus'] }
            };

            const keyMap = {};
            const usedKeys = new Set();
            
            // Ignore specific columns like S.NO and internal tracking links
            const hiddenCols = ['sno', 'slno', 'serialno', 'serialnumber', 'reportsentlink', 'rawdatasentto', 'rawdatasentlink', 'clientdoctorname'];
            allKeys.forEach(k => {
                const norm = normalize(k);
                if (hiddenCols.includes(norm)) {
                    usedKeys.add(k);
                }
            });

            // Map target columns
            Object.keys(definitions).forEach(defKey => {
                const patterns = definitions[defKey].keys;
                // Exact match first
                let matched = allKeys.find(k => !usedKeys.has(k) && patterns.includes(normalize(k)));
                // Contains match second
                if (!matched) {
                    matched = allKeys.find(k => {
                        if (usedKeys.has(k)) return false;
                        const norm = normalize(k);
                        return patterns.some(p => p.length >= 6 && (norm.includes(p) || p.includes(norm)));
                    });
                }
                if (matched) {
                    keyMap[defKey] = matched;
                    usedKeys.add(matched);
                }
            });

            const otherKeys = allKeys.filter(k => !usedKeys.has(k));

            // Generate Columns config
            const cols = [
                { title: 'Sample Name', getValue: (r) => keyMap.sampleName ? r[keyMap.sampleName] : '' },
                { title: 'Gender', getValue: (r) => {
                    const s = keyMap.sampleName ? String(r[keyMap.sampleName] || '') : '';
                    let m = s.match(/\b(MALE|FEMALE)\b/i) || s.match(/[\/\-\s,\|\(]\s*([MF])\s*(?:[\/\-\s,\|\)]|$)/i);
                    if (m) {
                        let g = (m[1] || m[2]).toUpperCase();
                        return (g === 'M' || g === 'MALE') ? 'Male' : 'Female';
                    }
                    if (keyMap.gender) {
                        let g = String(r[keyMap.gender] || '').trim().toUpperCase();
                        if (g === 'M' || g === 'MALE') return 'Male';
                        if (g === 'F' || g === 'FEMALE') return 'Female';
                        return r[keyMap.gender];
                    }
                    return ''; 
                }},
                { title: 'Age', getValue: (r) => {
                    const s = keyMap.sampleName ? String(r[keyMap.sampleName] || '') : '';
                    let m = s.match(/\b(\d{1,3})\s*(YRS?|Y|MONTHS?|M|DAYS?|D)\b/i);
                    if (m) {
                        let num = parseInt(m[1], 10);
                        let unit = m[2].toUpperCase().charAt(0);
                        let label = unit === 'M' ? 'Month' : (unit === 'D' ? 'Day' : 'Year');
                        return num + ' ' + label + (num === 1 ? '' : 's');
                    }
                    let m2 = s.match(/[\/\-\s,\|\(]\s*(\d{1,3})\s*[\/\-\s,\|\)]/);
                    if (m2) {
                        let num = parseInt(m2[1], 10);
                        return num + ' Year' + (num === 1 ? '' : 's');
                    }
                    
                    if (keyMap.age) {
                        let a = String(r[keyMap.age] || '').trim();
                        if (a && !isNaN(a)) {
                            let num = parseInt(a, 10);
                            return num + ' Year' + (num === 1 ? '' : 's');
                        }
                        return a;
                    }
                    return '';
                }},
                { title: 'Anderson ID', getValue: (r) => keyMap.andId ? r[keyMap.andId] : '' },
                { title: 'Sample Number', getValue: (r) => keyMap.sampleNumber ? r[keyMap.sampleNumber] : '' },
                { title: 'Test', getValue: (r) => keyMap.test ? r[keyMap.test] : '' },
                { title: 'Client Department', getValue: (r) => {
                    const sheet = r._sourceSheet || currentSheet;
                    const isDocName = v => /^Dr[\.\s]/i.test(String(v).trim());
                    const hasDate   = v => /\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4}/.test(v);
                    const clean     = v => { const m = v.match(/\s+(Dr[\.\s].+)/i); return m ? v.replace(m[0],'').trim() : v; };
                    const good      = v => { const s = String(v||'').trim(); return s && !isDocName(s) && !hasDate(s) ? s : ''; };

                    // Use the pre-detected column key (found by scanning actual cell values above)
                    if (clientDeptKey) {
                        const v = good(r[clientDeptKey]);
                        if (v) return clean(v);
                    }

                    // Apps Script sends the department as 'clientName' key
                    // (reads from "Client Name" OR "Client Department" column after the Apps Script fix)
                    const direct = String(r.clientName || '').trim();
                    if (direct && !isDocName(direct)) return clean(direct);

                    // Fallback: pre-detected key or keyMap (covers any future column rename)
                    if (clientDeptKey && r[clientDeptKey]) {
                        const v = String(r[clientDeptKey]).trim();
                        if (v && !isDocName(v)) return clean(v);
                    }
                    if (keyMap.clientDept && r[keyMap.clientDept]) {
                        const v = String(r[keyMap.clientDept]).trim();
                        if (v && !isDocName(v)) return clean(v);
                    }

                    // Last resort: parse from remarks
                    return clean(getRowClientName(r, sheet) || '');
                }},
                { title: 'Client Doctor Name', getValue: (r) => {
                    const sheet = r._sourceSheet || currentSheet;
                    // 1. Dedicated "Client Doctor Name" column
                    let docName = '';
                    Object.keys(r).forEach(k => {
                        if (normalize(k) === 'clientdoctorname' && r[k]) docName = String(r[k]).trim();
                    });
                    if (docName) return docName;
                    // 2. Extract Dr. suffix from the client column (older combined-format sheets)
                    const clientVal = String(getFieldValue(r, 'clientName', sheet) || r[keyMap.clientDept] || '').trim();
                    const m = clientVal.match(/\s+(Dr[\.\s].+)/i);
                    return m ? m[1].trim() : '';
                }},
                { title: 'Remarks', getValue: (r) => keyMap.remarks ? r[keyMap.remarks] : '' },
                { title: 'Received Date', getValue: (r) => keyMap.receivedDate ? r[keyMap.receivedDate] : '' },
                { title: 'Raw Data Sent', getValue: (r) => keyMap.rawDataDate ? r[keyMap.rawDataDate] : '' },
                { title: 'TAT Raw Data', getValue: (r) => keyMap.tatRawData ? r[keyMap.tatRawData] : '' },
                { title: 'TAT Report Date', getValue: (r) => keyMap.tatReportDate ? r[keyMap.tatReportDate] : '' },
                { title: 'Report Released Date', getValue: (r) => keyMap.reportReleasedDate ? r[keyMap.reportReleasedDate] : '' },
                { title: 'Status', getValue: (r) => calculateStatus(r, r._sourceSheet) },
                { title: 'Days Overdue', getValue: (r) => calculateDaysOverdue(r, r._sourceSheet) }
            ];

            const formatHeader = (key) => {
                const known = {
                    'sampleType': 'Sample Type',
                    'history': 'History',
                    'tatRawData': 'TAT Raw Data',
                    'reports': 'Reports'
                };
                if (known[key]) return known[key];
                return key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase()).trim();
            };

            let reportColAdded = false;
            otherKeys.forEach(ok => {
                const title = formatHeader(ok);
                const norm  = title.toLowerCase().replace(/\s/g,'');
                if (norm === 'reports') {
                    cols.push({ title: 'Choose Department', getValue: (r) => renderDepartmentCell(r), noSort: true });
                    cols.push({ title: 'Reports', getValue: (r) => renderReportCell(r, r[ok]), noSort: true });
                    cols.push({ title: 'Mail',    getValue: (r) => renderMailCell(r),           noSort: true });
                    reportColAdded = true;
                } else {
                    cols.push({ title, getValue: (r) => r[ok] });
                }
            });
            if (!reportColAdded) {
                cols.push({ title: 'Choose Department', getValue: (r) => renderDepartmentCell(r), noSort: true });
                cols.push({ title: 'Reports', getValue: (r) => renderReportCell(r, ''), noSort: true });
                cols.push({ title: 'Mail',    getValue: (r) => renderMailCell(r),       noSort: true });
            }

            currentTableCols = cols;

            let html = `
                <div class="result-header">
                    <h3>${title}</h3>
                    <div class="result-stats">
                        <div class="stat-item clickable stat-total${activeTATFilter ? '' : ' active-filter'}" onclick="filterByTATStatus(null)" title="Click to show all samples">
                            <div class="stat-label">Total Samples</div>
                            <div class="stat-value">${(statRows || rows).filter(r => !isRepeatSample(r, r._sourceSheet)).length}</div>
                        </div>
                        ${getTATStats(statRows || rows)}
                    </div>
                </div>
                <div class="bulk-release-bar" id="bulkReleaseBar" style="display:${selectedReleaseRows.size ? 'flex' : 'none'}">
                    <span id="bulkReleaseCount">${selectedReleaseRows.size} sample${selectedReleaseRows.size === 1 ? '' : 's'} selected</span>
                    <input type="date" id="bulkReleaseDate">
                    <button type="button" id="bulkReleaseApplyBtn" onclick="applyBulkReleaseDate()">Apply Release Date</button>
                    <button type="button" class="bulk-release-clear" onclick="clearReleaseSelection()">Clear</button>
                </div>
            `;

            html += '<div class="table-container"><table><thead><tr>';
            html += `<th class="col-select"><input type="checkbox" id="selectAllReleaseRows" class="row-select-cb" onchange="toggleSelectAllReleaseRows(this)" title="Select all rows shown"></th>`;

            const wideCols = new Set(['Sample Name', 'Test', 'Client Department', 'Client Doctor Name', 'Remarks']);
            cols.forEach((col, index) => {
                if (col.noSort) {
                    const cls = col.title === 'Reports' ? 'col-report' : col.title === 'Choose Department' ? 'col-dept' : 'col-mail';
                    html += `<th class="${cls}">${col.title}</th>`;
                } else {
                    let thClass = col.title === 'History' ? 'sortable col-history' : 'sortable';
                    if (wideCols.has(col.title)) thClass += ' col-wide';
                    html += `<th class="${thClass}" onclick="sortTable(${index})">${col.title}</th>`;
                }
            });

            html += '</tr></thead><tbody id="tableBody">';

            rows.forEach(row => {
                const rowClass = getTATClass(row);
                html += `<tr class="${rowClass}" data-rowkey="${encodeURIComponent(_rowKey(row))}">`;

                const relSheet = row._sourceSheet || currentSheet;
                const relKey = row._rowIndex ? _relKey(relSheet, row._rowIndex) : '';
                const relChecked = relKey && selectedReleaseRows.has(relKey) ? ' checked' : '';
                const relDisabled = row._rowIndex ? '' :
                    ' disabled title="This row has no sheet position yet — redeploy the Apps Script to enable bulk date fill"';
                html += `<td class="col-select"><input type="checkbox" class="row-select-cb"${relChecked}${relDisabled} `
                     + `onchange="toggleReleaseRowSelection(this,'${encodeURIComponent(relSheet)}',${row._rowIndex || 0})"></td>`;

                cols.forEach(col => {
                    const value = col.getValue(row);
                    if (col.title === 'Status') {
                        const badgeCls = value === 'Released' ? 'badge-released' : value === 'Overdue' ? 'badge-overdue' : 'badge-ongoing';
                        html += `<td><span class="status-badge ${badgeCls}">${value}</span></td>`;
                    } else if (col.title === 'Choose Department') {
                        html += `<td class="col-dept">${value}</td>`;
                    } else if (col.title === 'Reports') {
                        html += `<td class="col-report">${value}</td>`;
                    } else if (col.title === 'Mail') {
                        html += `<td class="col-mail">${value}</td>`;
                    } else {
                        let tdClass = '';
                        if (col.title === 'History') tdClass = ' class="col-history"';
                        else if (wideCols.has(col.title)) tdClass = ' class="col-wide"';
                        html += `<td${tdClass}>${value !== null && value !== undefined ? value : ''}</td>`;
                    }
                });
                
                html += '</tr>';
            });
            
            html += '</tbody></table></div>';
            
            // Add scroll hint if table is wide
            const scrollHintHtml = cols.length > 8 ? '<div class="scroll-hint show">Scroll horizontally to see more columns</div>' : '';
            
            document.getElementById('contentArea').innerHTML = html;
            
            setTimeout(() => {
                const container = document.querySelector('.table-container');
                if (container) {
                    const needsScroll = container.scrollWidth > container.clientWidth;
                    if (needsScroll && !scrollHintHtml) {
                        const hint = document.createElement('div');
                        hint.className = 'scroll-hint show';
                        hint.textContent = 'Scroll horizontally to see more columns';
                        container.parentNode.insertBefore(hint, container);
                    }
                }
            }, 100);
        }

        function getTATStats(rows) {
            let ongoing = 0, overdue = 0, completed = 0;

            rows.forEach(row => {
                const sheetName = row._sourceSheet || currentSheet;

                // Repeat samples are released, but shouldn't add a 2nd count for the same sample
                if (isRepeatSample(row, sheetName)) return;

                const status = calculateStatus(row, sheetName);

                if (status === 'Released') {
                    completed++;
                } else if (status === 'Overdue') {
                    overdue++;
                } else {
                    ongoing++;
                }
            });
            
            const colorCls = { Ongoing: 'stat-ongoing', Overdue: 'stat-overdue', Released: 'stat-completed' };
            const cls = (status) => `stat-item clickable ${colorCls[status]}${activeTATFilter === status ? ' active-filter' : ''}`;
            let html = `
                <div class="${cls('Ongoing')}" onclick="filterByTATStatus('Ongoing')" title="Click to filter ongoing samples">
                    <div class="stat-label">⏳ Ongoing</div>
                    <div class="stat-value">${ongoing}</div>
                </div>
                <div class="${cls('Overdue')}" onclick="filterByTATStatus('Overdue')" title="Click to filter overdue samples">
                    <div class="stat-label">🚨 Overdue</div>
                    <div class="stat-value">${overdue}</div>
                </div>
                <div class="${cls('Released')}" onclick="filterByTATStatus('Released')" title="Click to filter completed samples">
                    <div class="stat-label">✅ Completed</div>
                    <div class="stat-value">${completed}</div>
                </div>
            `;

            return html;
        }

        function filterByTATStatus(status) {
            if (status === null || activeTATFilter === status) {
                activeTATFilter = null;
            } else {
                activeTATFilter = status;
            }
            if (currentSheet) {
                displaySheet(currentSheet);
            }
        }

        function getTATClass(row) {
            const sheetName = row._sourceSheet || currentSheet;
            const status = calculateStatus(row, sheetName);
            
            if (status === 'Released') return 'tat-completed';
            if (status === 'Overdue') return 'tat-overdue';
            if (status === 'Ongoing') return 'tat-pending';
            
            return '';
        }

        function parseDate(dateStr) {
            if (!dateStr || dateStr === '' || dateStr === null || dateStr === undefined) {
                return null;
            }

            const dateString = String(dateStr).trim();
            if (!dateString) return null;

            // Try multiple date formats
            const formats = [
                // DD/MM/YYYY
                /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/,
                // MM/DD/YYYY
                /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/,
                // YYYY-MM-DD
                /^(\d{4})-(\d{1,2})-(\d{1,2})$/,
                // DD-MM-YYYY
                /^(\d{1,2})-(\d{1,2})-(\d{4})$/,
            ];

            // Try DD/MM/YYYY first (most common in lab context)
            let match = dateString.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (match) {
                const day = parseInt(match[1]);
                const month = parseInt(match[2]) - 1; // JS months are 0-indexed
                const year = parseInt(match[3]);
                
                const date = new Date(year, month, day);
                
                // Validate the date
                if (!isNaN(date.getTime()) && 
                    date.getDate() === day && 
                    date.getMonth() === month && 
                    date.getFullYear() === year) {
                    return date;
                }
            }

            // Try YYYY-MM-DD
            match = dateString.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
            if (match) {
                const year = parseInt(match[1]);
                const month = parseInt(match[2]) - 1;
                const day = parseInt(match[3]);

                const date = new Date(year, month, day);
                if (!isNaN(date.getTime())) {
                    return date;
                }
            }

            // Try DD-MM-YYYY (dash-separated — this is the sheet's actual format;
            // without this branch it fell through to native Date parsing below,
            // which reads dashed dates as MM-DD-YYYY and swaps day/month)
            match = dateString.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
            if (match) {
                const day = parseInt(match[1]);
                const month = parseInt(match[2]) - 1;
                const year = parseInt(match[3]);

                const date = new Date(year, month, day);
                if (!isNaN(date.getTime()) &&
                    date.getDate() === day &&
                    date.getMonth() === month &&
                    date.getFullYear() === year) {
                    return date;
                }
            }

            // Try native Date parsing as fallback
            const date = new Date(dateString);
            if (!isNaN(date.getTime())) {
                return date;
            }
            
            console.warn(`Could not parse date: ${dateString}`);
            return null;
        }

        function sortTable(columnIndex) {
            if (!currentTableCols || !currentTableCols[columnIndex]) return;
            if (currentTableCols[columnIndex].noSort) return;
            
            const colDef = currentTableCols[columnIndex];
            
            if (sortColumn === columnIndex) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = columnIndex;
                sortDirection = 'asc';
            }
            
            currentView.sort((a, b) => {
                let valA = colDef.getValue(a);
                let valB = colDef.getValue(b);
                
                if (valA === null || valA === undefined) valA = '';
                if (valB === null || valB === undefined) valB = '';
                
                const dateA = parseDate(valA);
                const dateB = parseDate(valB);
                if (dateA && dateB) {
                    return sortDirection === 'asc' ? dateA - dateB : dateB - dateA;
                }
                
                if (valA !== '' && valB !== '') {
                    const numA = parseFloat(valA);
                    const numB = parseFloat(valB);
                    if (!isNaN(numA) && !isNaN(numB) && String(numA) === String(valA).trim() && String(numB) === String(valB).trim()) {
                        return sortDirection === 'asc' ? numA - numB : numB - numA;
                    }
                }
                
                valA = String(valA).toLowerCase();
                valB = String(valB).toLowerCase();
                
                if (sortDirection === 'asc') {
                    return valA < valB ? -1 : valA > valB ? 1 : 0;
                } else {
                    return valA > valB ? -1 : valA < valB ? 1 : 0;
                }
            });
            
            const titleElement = document.querySelector('.result-header h3');
            const title = titleElement ? titleElement.textContent : '';
            renderTable(currentView, title);
            
            document.querySelectorAll('th').forEach((th, idx) => {
                th.classList.remove('sorted-asc', 'sorted-desc');
                if (idx === columnIndex) {
                    th.classList.add(sortDirection === 'asc' ? 'sorted-asc' : 'sorted-desc');
                }
            });
        }

        function searchTable() {
            const searchBox = document.getElementById('searchBox');
            const searchTerm = searchBox.value.toLowerCase().trim();
            if (searchTerm) deactivateAnalyticsNav();

            if (!searchTerm) {
                const currentTitle = document.querySelector('.result-header h3');
                if (currentTitle) {
                    const title = currentTitle.textContent.replace(' (Filtered)', '');
                    renderTable(currentView, title);
                }
                return;
            }

            const matchesTerm = row => Object.values(row).some(val => {
                if (val === null || val === undefined) return false;
                return String(val).toLowerCase().includes(searchTerm);
            });

            // A global search: the point is finding a sample when you don't know
            // which month it's in, so this searches every sheet, not just the
            // one currently open.
            const allMatches = [];
            Object.keys(allData).forEach(sheetName => {
                (allData[sheetName].rows || []).forEach(row => {
                    const rowWithSource = { ...row, _sourceSheet: sheetName };
                    if (matchesTerm(rowWithSource)) allMatches.push(rowWithSource);
                });
            });

            const rawTerm = searchBox.value;

            if (allMatches.length === 0) {
                document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
                document.getElementById('contentArea').innerHTML = `
                    <div class="result-header"><h3>Search: "${rawTerm}"</h3></div>
                    <div class="no-data">No samples match "${rawTerm}" in any month</div>`;
                return;
            }

            const sheetsWithMatches = [...new Set(allMatches.map(r => r._sourceSheet))];

            if (sheetsWithMatches.length === 1) {
                // Every match lives in one month — jump to that tab (like clicking
                // it) so the sample is shown in its normal context, filtered down.
                const sheetName = sheetsWithMatches[0];
                currentSheet = sheetName;
                document.querySelectorAll('.tab').forEach(tab => {
                    tab.classList.toggle('active', tab.textContent === sheetName);
                });
                const sheetData = allData[sheetName];
                currentView = (sheetData.rows || []).map(row => ({ ...row, _sourceSheet: sheetName }));
                const filtered = currentView.filter(matchesTerm);
                renderTable(filtered, `${sheetName} - Search: "${rawTerm}"`, sheetData.headers, currentView);
            } else {
                // Spread across months — show every match together instead of
                // picking one tab arbitrarily.
                document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
                renderTable(allMatches, `Search: "${rawTerm}" (${sheetsWithMatches.length} months)`);
            }
        }

        function applyTopFilter() {
            deactivateAnalyticsNav();
            const client = document.getElementById('clientSelect').value;

            let filteredData = [];
            let title = client ? `Client: ${client}` : 'All Clients';

            Object.keys(allData).forEach(sheetName => {
                (allData[sheetName].rows || []).forEach(row => {
                    const rowClient = getNormalizedClientName(getRowClientName(row, sheetName));
                    if (client && rowClient !== client) return;
                    filteredData.push({ ...row, _sourceSheet: sheetName });
                });
            });

            if (filteredData.length === 0) {
                alert('No data found for the selected criteria');
                return;
            }

            const _client = client;
            activeFilterFn = (row, sheetName) => {
                const rowClient = getNormalizedClientName(getRowClientName(row, sheetName));
                return !_client || rowClient === _client;
            };
            activeFilterLabel = title;

            currentView = filteredData;
            renderTable(filteredData, title);
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
        }

        function resetTopFilter() {
            document.getElementById('clientSelect').value = '';
            activeFilterFn = null;
            activeFilterLabel = '';
            showAllSheets();
        }


        // Close modals when clicking outside
        document.getElementById('configModal').addEventListener('click', function(e) {
            if (e.target === this) closeConfigModal();
        });
        document.getElementById('emailModal').addEventListener('click', function(e) {
            if (e.target === this) closeEmailModal();
        });
    </script>
