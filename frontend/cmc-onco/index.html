<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anderson CMC-ONCO Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <style>
    :root {
      /* === Forest Teal — Professional Clinical Theme === */
      --accent: #0d9488;
      --accent-hover: #0f766e;
      --accent-light: #5eead4;
      --accent-glow: rgba(13, 148, 136, 0.20);
      --main-bg: #f0faf7;
      --card-bg: #ffffff;
      --text-main: #0c3528;
      --text-muted: #4a7a6d;
      --border: #b2e4d9;
      --border-strong: #6dc8b8;
      --success: #16a34a;
      --danger: #dc2626;
      --shadow: 0 2px 16px rgba(14, 79, 64, 0.10);
      --shadow-md: 0 4px 24px rgba(14, 79, 64, 0.13);
      --shadow-lg: 0 8px 40px rgba(14, 79, 64, 0.16);
      --shadow-xl: 0 16px 60px rgba(14, 79, 64, 0.25);
      --tr: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      --radius: 12px;
      /* compat aliases */
      --sidebar-bg: #0e4f40;
      --sidebar-active-bg: rgba(255, 255, 255, 0.14);
      --sidebar-active-text: #fff;
      --sidebar-text: #ccf2ea;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-light);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--main-bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* === TOP HEADER BAR === */
    .app-header {
      height: 60px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      background: linear-gradient(120deg, #0a3d30 0%, #0e4f40 50%, #166554 100%);
      color: #ccf2ea;
      box-shadow: 0 2px 14px rgba(14, 79, 64, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
      z-index: 60;
    }

    .app-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .back-to-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      transition: var(--tr);
      flex-shrink: 0;
    }

    .back-to-home:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      transform: translateX(-2px);
    }

    .back-to-home [data-lucide] {
      width: 15px;
      height: 15px;
    }

    .app-logo {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent) 0%, #1a7a65 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 2px 8px rgba(0, 0, 0, 0.22);
      flex-shrink: 0;
    }

    .app-logo [data-lucide] {
      width: 19px;
      height: 19px;
      color: #fff;
    }

    .app-header h1 {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-header-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .btn-sync-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 50px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      color: var(--accent);
      cursor: pointer;
      transition: var(--tr);
    }

    .btn-sync-icon:hover {
      border-color: var(--accent);
      color: var(--accent-hover);
      box-shadow: 0 0 0 3px var(--accent-glow);
      transform: rotate(90deg);
    }

    .btn-sync-icon [data-lucide] {
      width: 15px;
      height: 15px;
    }

    .app-version {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* "Signed in" pill at the header right (light text on dark header) */
    .signed-in-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #d6fff4;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .signed-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 7px rgba(74, 222, 128, 0.8);
    }

    /* === MERGED NAV + TOOLS ROW === */
    .app-nav {
      flex-shrink: 0;
      background: linear-gradient(120deg, #0c4537 0%, #0e4f40 60%, #135e4c 100%);
      box-shadow: 0 2px 12px rgba(14, 79, 64, 0.18);
      padding: 7px 18px;
      z-index: 55;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    ul.nav-list {
      list-style: none;
      display: flex;
      align-items: stretch;
      gap: 2px;
      overflow-x: auto;
      flex-shrink: 1;
      min-width: 0;
    }

    li.nav-item {
      flex-shrink: 0;
    }

    /* Batch selector + status badge + go-to, grouped at the right of the nav row */
    .app-nav .nav-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    /* Live sync status cluster, in the header row (dark) */
    .sync-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-header .sync-cluster .btn-sync-icon {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #e6fffa;
    }

    .app-header .sync-cluster .btn-sync-icon:hover {
      background: rgba(255, 255, 255, 0.24);
      box-shadow: none;
      color: #fff;
    }

    .app-header .sync-status {
      color: rgba(230, 255, 250, 0.85);
      font-size: 0.74rem;
    }

    .app-header .status-dot {
      background: rgba(255, 255, 255, 0.4);
    }

    .app-header .status-dot.active {
      background: #4ade80;
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.7);
    }

    .app-header .app-version {
      color: rgba(230, 255, 250, 0.7);
    }

    /* Batch selector (inline in the nav row) */
    .batch-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    /* Footer bar */
    .app-footer {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 28px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .nav-btn {
      display: flex;
      align-items: center;
      padding: 11px 16px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: rgba(204, 242, 234, 0.72);
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--tr);
      white-space: nowrap;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }

    .nav-btn.active {
      color: #fff;
      font-weight: 700;
      border-bottom-color: var(--accent-light);
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-btn .label {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .nav-btn .label [data-lucide] {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* === MAIN CONTENT === */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* === SUB-HEADER (batch selector + pipeline status) === */
    .sub-header {
      flex-shrink: 0;
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 12px 28px;
    }

    .sub-header-inner {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    /* === TOOLBAR === */
    .toolbar {
      min-height: 64px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 16px rgba(14, 79, 64, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 28px;
      gap: 18px;
      flex-shrink: 0;
      position: relative;
      z-index: 5;
    }

    .toolbar-left {
      flex: 1;
      max-width: 420px;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .search-container {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--main-bg);
      border: 1.5px solid var(--border);
      border-radius: 50px;
      overflow: hidden;
      transition: var(--tr);
    }

    .search-container:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.12);
      background: #fff;
    }

    .search-container i.search-icon {
      margin-left: 16px;
      color: var(--text-muted);
      width: 16px;
      height: 16px;
    }

    .search-input {
      flex: 1;
      padding: 10px 14px;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 0.875rem;
      outline: none;
      color: var(--text-main);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .btn-search-exec {
      background: var(--accent);
      color: #fff;
      border: none;
      margin: 5px 6px 5px 0;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--tr);
    }

    .btn-search-exec:hover {
      background: var(--accent-hover);
      transform: scale(1.1);
    }

    .btn-search-exec svg {
      width: 13px;
      height: 13px;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--border-strong);
      border-radius: 50%;
    }

    .status-dot.active {
      background: var(--success);
      box-shadow: 0 0 6px rgba(5, 150, 105, 0.55);
    }

    .btn-filter {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 50px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--tr);
      color: var(--text-muted);
    }

    .btn-filter:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
    }

    .btn-filter.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: var(--shadow);
    }

    #btn-reset-test {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      background: #fff5f5;
      border: 1.5px solid #fecaca;
      border-radius: 50px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--tr);
      color: var(--danger);
    }

    #btn-reset-test:hover {
      background: #fee2e2;
      border-color: #fca5a5;
    }

    /* === TABLE === */
    .table-container {
      flex: 1;
      overflow: auto;
      padding: 0;
      background: var(--card-bg);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: left;
      min-width: max-content;
      table-layout: fixed;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 10;
      background: linear-gradient(135deg, #0e4f40 0%, #1a7a65 100%);
      box-shadow: 0 4px 24px rgba(45, 27, 105, 0.4);
    }

    th {
      padding: 17px 22px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-size: 0.68rem;
      color: rgba(230, 255, 250, 0.9);
      text-align: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    td {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      color: var(--text-main);
      white-space: normal;
      word-break: break-word;
      line-height: 1.65;
      vertical-align: middle;
      text-align: center;
      transition: var(--tr);
    }

    tr:nth-child(even) td {
      background: #f4fbf9;
    }

    tr:hover td {
      background: #e9f7f3;
    }

    /* === FILTER DRAWER === */
    .filter-drawer {
      position: fixed;
      right: -340px;
      top: 0;
      width: 340px;
      height: 100vh;
      background: var(--card-bg);
      box-shadow: -8px 0 40px rgba(109, 40, 217, 0.2);
      z-index: 100;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
    }

    .filter-drawer.open {
      right: 0;
    }

    .filter-header {
      padding: 18px 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, #0e4f40, #1a7a65);
    }

    .filter-header h2 {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .btn-close-filter {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.7);
      border-radius: 6px;
      padding: 4px 6px;
      transition: var(--tr);
    }

    .btn-close-filter:hover {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }

    .filter-content {
      flex: 1;
      overflow-y: auto;
      padding: 18px 22px;
    }

    .filter-group {
      margin-bottom: 18px;
    }

    .filter-group label {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .filter-group input,
    .filter-group select {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      background: var(--main-bg);
      color: var(--text-main);
      transition: var(--tr);
    }

    .filter-group input:focus,
    .filter-group select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
    }

    .filter-footer {
      padding: 18px 22px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .btn-reset {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.84rem;
      color: var(--text-muted);
      transition: var(--tr);
    }

    .btn-reset:hover {
      border-color: var(--border-strong);
      color: var(--text-main);
    }

    .btn-apply {
      flex: 1;
      padding: 10px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      transition: var(--tr);
      box-shadow: var(--shadow);
    }

    .btn-apply:hover {
      background: var(--accent-hover);
    }

    /* === SEND EMAIL BUTTON === */
    .btn-send-email {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      background: linear-gradient(135deg, var(--accent) 0%, #065f46 100%);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--tr);
      box-shadow: 0 4px 16px rgba(13, 148, 136, 0.35);
    }

    .btn-send-email:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(13, 148, 136, 0.5);
      filter: brightness(1.08);
    }

    .btn-send-email svg {
      width: 14px;
      height: 14px;
    }

    #email-modal-send:not([disabled]) {
      opacity: 1;
    }

    #email-modal-send:not([disabled]):hover {
      filter: brightness(1.1);
    }

    /* === PPT COLUMN === */
    td.ppt-col {
      width: 200px;
      vertical-align: middle;
    }

    .ppt-cell {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: stretch;
    }

    .btn-ppt-upload {
      padding: 6px 10px;
      border-radius: 20px;
      border: 1.5px solid rgba(13, 148, 136, 0.35);
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      background: rgba(13, 148, 136, 0.08);
      color: var(--accent);
      transition: var(--tr);
    }

    .btn-ppt-upload:hover {
      background: rgba(13, 148, 136, 0.16);
    }

    .btn-ppt-dl {
      padding: 6px 10px;
      border-radius: 20px;
      border: 1.5px solid rgba(5, 150, 105, 0.3);
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      background: rgba(5, 150, 105, 0.08);
      color: #059669;
      transition: var(--tr);
    }

    .btn-ppt-dl:hover {
      background: rgba(5, 150, 105, 0.16);
    }

    .btn-ppt-del {
      padding: 6px 10px;
      border-radius: 20px;
      border: 1.5px solid rgba(220, 38, 38, 0.28);
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      background: rgba(220, 38, 38, 0.06);
      color: var(--danger);
      transition: var(--tr);
    }

    .btn-ppt-del:hover {
      background: rgba(220, 38, 38, 0.14);
    }

    .ppt-filename {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* === DATA UPLOAD COLUMNS === */
    td.jobid-col {
      width: 210px;
      vertical-align: middle;
      text-align: left;
      padding: 10px;
    }

    .jobid-input {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.75rem;
      outline: none;
      color: var(--text-main);
      background: var(--main-bg);
      box-sizing: border-box;
      cursor: text;
      display: block;
      resize: vertical;
      line-height: 1.6;
      transition: var(--tr);
    }

    .jobid-input:hover {
      border-color: var(--border-strong);
    }

    .jobid-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
    }

    td.img-col {
      width: 200px;
      vertical-align: middle;
    }

    .img-cell {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .btn-img-upload {
      padding: 6px 10px;
      border-radius: 20px;
      border: 1.5px solid rgba(5, 150, 105, 0.3);
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      background: rgba(5, 150, 105, 0.08);
      color: #059669;
      transition: var(--tr);
    }

    .btn-img-upload:hover {
      background: rgba(5, 150, 105, 0.16);
    }

    td.mail-sent-du-col {
      width: 200px;
      vertical-align: middle;
    }

    /* === DIRECTORY COLUMN === */
    td.dir-col {
      width: 220px;
      vertical-align: middle;
    }

    .dir-input {
      width: 100%;
      padding: 7px 9px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.75rem;
      resize: vertical;
      min-height: 52px;
      outline: none;
      color: var(--text-main);
      background: var(--main-bg);
      line-height: 1.5;
      transition: var(--tr);
    }

    .dir-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
    }

    /* === MAIL SENT COLUMN === */
    td.mail-sent-col {
      width: 180px;
      vertical-align: middle;
    }

    .mail-sent-cell {
      font-size: 0.72rem;
      font-weight: 600;
      color: #059669;
      text-align: center;
      line-height: 1.5;
    }

    .mail-sent-cell.pending {
      color: var(--text-muted);
      font-weight: 400;
      font-style: italic;
    }

    /* === BATCH FILE CELL === */
    .batch-file-cell {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: stretch;
    }

    .btn-batch-upload,
    .btn-batch-show-dl {
      padding: 6px 10px;
      border-radius: 20px;
      border: none;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: var(--tr);
      white-space: nowrap;
      width: 100%;
    }

    .btn-batch-upload {
      background: rgba(13, 148, 136, 0.1);
      color: var(--accent);
      border: 1.5px solid rgba(13, 148, 136, 0.35);
    }

    .btn-batch-upload:hover {
      background: rgba(13, 148, 136, 0.18);
    }

    .btn-batch-show-dl {
      background: rgba(5, 150, 105, 0.08);
      color: #059669;
      border: 1.5px solid rgba(5, 150, 105, 0.28);
    }

    .btn-batch-show-dl:hover {
      background: rgba(5, 150, 105, 0.16);
    }

    td.file-col {
      width: 180px;
      vertical-align: middle;
    }

    /* === FILE POPOVER === */
    #file-popover {
      display: none;
      position: fixed;
      z-index: 999;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      min-width: 230px;
      max-width: 290px;
      overflow: hidden;
    }

    #file-popover.open {
      display: block;
    }

    .fp-header {
      padding: 10px 14px;
      font-size: 0.67rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(233, 213, 255, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #0e4f40, #1a7a65);
    }

    .fp-close {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.7);
      border-radius: 4px;
      padding: 2px 6px;
    }

    .fp-close:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .fp-file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      cursor: pointer;
      transition: var(--tr);
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-main);
    }

    .fp-file-item:hover {
      background: var(--main-bg);
    }

    .fp-btn-dl,
    .fp-btn-del {
      border: none;
      border-radius: 20px;
      padding: 3px 8px;
      font-size: 0.67rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .fp-btn-dl {
      background: rgba(5, 150, 105, 0.1);
      color: #059669;
      border: 1px solid rgba(5, 150, 105, 0.28);
    }

    .fp-btn-dl:hover {
      background: rgba(5, 150, 105, 0.18);
    }

    .fp-btn-del {
      background: rgba(220, 38, 38, 0.08);
      color: var(--danger);
      border: 1px solid rgba(220, 38, 38, 0.24);
    }

    .fp-btn-del:hover {
      background: rgba(220, 38, 38, 0.16);
    }

    .fp-file-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fp-dl-all {
      margin: 10px 14px 12px;
      padding: 9px;
      width: calc(100% - 28px);
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: var(--tr);
      box-shadow: var(--shadow);
    }

    .fp-dl-all:hover {
      background: var(--accent-hover);
    }

    /* === FILE PANEL === */
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      margin-bottom: 7px;
      background: var(--main-bg);
      transition: var(--tr);
    }

    .file-item:hover {
      border-color: var(--border-strong);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .file-item-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .file-item-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .file-item-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .file-item-actions {
      display: flex;
      gap: 7px;
    }

    .btn-file-action {
      padding: 5px 12px;
      border-radius: 20px;
      border: none;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: var(--tr);
    }

    .btn-file-dl {
      background: rgba(13, 148, 136, 0.1);
      color: var(--accent);
      border: 1.5px solid rgba(13, 148, 136, 0.35);
    }

    .btn-file-dl:hover {
      background: rgba(13, 148, 136, 0.18);
    }

    .btn-file-del {
      background: rgba(220, 38, 38, 0.07);
      color: var(--danger);
      border: 1.5px solid rgba(220, 38, 38, 0.25);
    }

    .btn-file-del:hover {
      background: rgba(220, 38, 38, 0.15);
    }

    #file-drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(13, 148, 136, 0.05);
    }

    /* === DOWNLOAD DROPDOWN === */
    .download-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 190px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      z-index: 200;
      overflow: hidden;
    }

    .download-dropdown.open {
      display: block;
    }

    .download-dropdown-header {
      padding: 10px 16px;
      font-size: 0.66rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: rgba(233, 213, 255, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(135deg, #0e4f40, #1a7a65);
    }

    .download-batch-item {
      padding: 10px 16px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text-main);
      transition: var(--tr);
    }

    .download-batch-item:hover {
      background: var(--main-bg);
      color: var(--accent);
    }

    /* === EMPTY STATE === */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px;
      color: var(--text-muted);
      text-align: center;
    }

    .empty-state i {
      width: 56px;
      height: 56px;
      margin-bottom: 16px;
      opacity: 0.25;
    }

    /* === LOADER === */
    .loader-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(245, 243, 255, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
      backdrop-filter: blur(6px);
    }

    .loader {
      width: 36px;
      height: 36px;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* === QC STATUS BADGES === */
    @keyframes qc-blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.25
      }
    }

    .qc-under-process {
      display: inline-block;
      color: #dc2626;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(220, 38, 38, 0.08);
      border: 1px solid rgba(220, 38, 38, 0.28);
      animation: qc-blink 1.2s ease-in-out infinite;
      letter-spacing: 0.01em;
    }

    .qc-pass {
      display: inline-block;
      color: #16a34a;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(22, 163, 74, 0.10);
      border: 1px solid rgba(22, 163, 74, 0.28);
    }

    .qc-fail {
      display: inline-block;
      color: #dc2626;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(220, 38, 38, 0.09);
      border: 1px solid rgba(220, 38, 38, 0.28);
      margin-bottom: 5px;
    }

    .qc-repeat {
      display: inline-block;
      font-size: 0.67rem;
      font-weight: 600;
      color: #b91c1c;
      background: rgba(220, 38, 38, 0.06);
      border: 1px dashed rgba(220, 38, 38, 0.45);
      border-radius: 6px;
      padding: 3px 9px;
      line-height: 1.4;
    }

    /* === SIDEBAR PIPELINE PANEL === */
    /* Sub-header pipeline layout overrides .pipeline-section legacy padding */
    .pipeline-section.sub-header {
      padding: 12px 28px;
      border-bottom: 1px solid var(--border);
    }

    .pipeline-section-header {
      display: none;
    }

    .pipeline-card-wrap {
      display: contents;
    }

    #pipeline-status-display {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
      margin-left: auto;
      flex-shrink: 0;
    }

    .pipeline-select {
      padding: 9px 18px;
      background: #fff;
      color: var(--text-main);
      border: 1.5px solid var(--border-strong);
      border-radius: 50px;
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      font-weight: 700;
      min-width: 120px;
      transition: var(--tr);
    }

    .pipeline-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .pipeline-select option {
      background: #fff;
      color: var(--text-main);
    }

    /* Status pill — coloured text on soft tinted background */
    #pipeline-status-display .pipeline-badge {
      display: inline-flex;
      align-items: center;
      margin: 0;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 8px;
      padding: 8px 16px;
      border: 1px solid transparent;
      animation: none !important;
      text-align: center;
    }

    #pipeline-status-display .pipeline-badge.processing {
      color: #b45309;
      background: #fef3e2;
      border-color: #fcd9a3;
    }

    #pipeline-status-display .pipeline-badge.qc-active {
      color: #6d28d9;
      background: #f3effe;
      border-color: #d8c9f7;
    }

    #pipeline-status-display .pipeline-badge.pipeline-active {
      color: #0f766e;
      background: #e6f7f3;
      border-color: #a3e0d4;
    }

    #pipeline-status-display .pipeline-badge.complete {
      color: #15803d;
      background: #e8f7ed;
      border-color: #a7e0bb;
    }

    #pipeline-status-display .pipeline-badge.fail {
      color: #dc2626;
      background: #fdeaea;
      border-color: #f6bdbd;
    }

    #pipeline-status-display .pipeline-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-style: italic;
      line-height: 1.4;
    }

    .btn-goto-sidebar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid var(--border-strong);
      background: #fff;
      color: var(--accent-hover);
      font-family: inherit;
      transition: var(--tr);
      text-align: center;
    }

    .btn-goto-sidebar:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
      transform: translateY(-1px);
    }

    /* === PIPELINE STATUS COLUMN === */
    .pipeline-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .pipeline-badge {
      display: inline-block;
      font-size: 0.71rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      line-height: 1.4;
      text-align: center;
    }

    .pipeline-badge.processing {
      color: #b45309;
      background: rgba(245, 158, 11, 0.10);
      border: 1px solid rgba(245, 158, 11, 0.35);
      animation: qc-blink 1.4s ease-in-out infinite;
    }

    .pipeline-badge.qc-active {
      color: #7c3aed;
      background: rgba(124, 58, 237, 0.09);
      border: 1px solid rgba(124, 58, 237, 0.3);
    }

    .pipeline-badge.pipeline-active {
      color: var(--accent);
      background: rgba(13, 148, 136, 0.09);
      border: 1px solid rgba(13, 148, 136, 0.3);
    }

    .pipeline-badge.complete {
      color: #16a34a;
      background: rgba(22, 163, 74, 0.10);
      border: 1px solid rgba(22, 163, 74, 0.3);
    }

    .pipeline-badge.fail {
      color: #dc2626;
      background: rgba(220, 38, 38, 0.09);
      border: 1px solid rgba(220, 38, 38, 0.3);
    }

    .btn-goto-tab {
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 0.67rem;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid var(--accent);
      color: var(--accent);
      background: transparent;
      font-family: inherit;
      transition: var(--tr);
      white-space: nowrap;
    }

    .btn-goto-tab:hover {
      background: var(--accent);
      color: #fff;
    }

    /* === FROZEN COLUMNS === */
    th {
      position: relative;
    }

    /* needed for pin button */
    th.col-frozen {
      position: sticky;
      z-index: 12;
    }

    td.col-frozen {
      position: sticky;
      z-index: 2;
      background: #fff;
    }

    tbody tr:nth-child(even) td.col-frozen {
      background: #faf9ff;
    }

    tbody tr:hover td.col-frozen {
      background: #f5f3ff;
    }

    th.col-freeze-edge {
      box-shadow: inset -3px 0 0 rgba(255, 255, 255, 0.45);
    }

    td.col-freeze-edge {
      box-shadow: inset -3px 0 0 var(--border-strong);
    }

    /* Pin button on column headers */
    .col-freeze-pin {
      position: absolute;
      top: 50%;
      right: 5px;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      opacity: 0;
      transition: opacity .15s, background .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
    }

    .col-freeze-pin::after {
      content: '';
      display: block;
      width: 2px;
      height: 9px;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 1px;
    }

    th:hover .col-freeze-pin {
      opacity: 1;
    }

    .col-freeze-pin.frozen {
      opacity: 1;
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.55);
    }

    .col-freeze-pin.frozen::after {
      background: #fff;
    }

    .app-error-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: #fdecea;
      color: #7a1710;
      border-bottom: 1px solid #f3b4ab;
      font-size: 14px;
      font-weight: 500;
    }

    .app-error-banner.visible {
      display: flex;
    }

    .app-error-banner i[data-lucide="alert-triangle"] {
      flex-shrink: 0;
      color: #c0392b;
    }

    .app-error-banner .app-error-msg {
      flex: 1;
    }

    .app-error-banner .app-error-close {
      cursor: pointer;
      background: none;
      border: none;
      color: #7a1710;
      padding: 4px;
      display: flex;
    }
  </style>
</head>

<body>

  <!-- Top header bar -->
  <header class="app-header">
    <div class="app-header-left">
      <a href="/cmc/" class="back-to-home" title="Back to CMC Trackers">
        <i data-lucide="arrow-left"></i>
      </a>
      <div class="app-logo"><i data-lucide="microscope"></i></div>
      <h1>Anderson CMC-ONCO Tracker</h1>
    </div>

    <div class="app-header-right">
      <div class="sync-cluster">
        <button class="btn-sync-icon" id="btn-sync" title="Sync Now · Auto-refresh every 1 min">
          <i data-lucide="refresh-cw"></i>
        </button>
        <div class="sync-status">
          <span class="status-dot" id="status-dot"></span>
          <span id="sync-time">No file uploaded</span>
        </div>
        <span class="app-version">Mint v1.3.0</span>
        <div id="next-refresh-label" style="display:none">Auto-refresh every 1 min</div>
      </div>
      <span class="signed-in-pill"><span class="signed-dot"></span> Signed in</span>
    </div>
  </header>

  <!-- Error / warning banner for backend or app-level issues -->
  <div class="app-error-banner" id="app-error-banner">
    <i data-lucide="alert-triangle"></i>
    <span class="app-error-msg" id="app-error-msg"></span>
    <button class="app-error-close" id="app-error-close" title="Dismiss"><i data-lucide="x"></i></button>
  </div>

  <!-- Navigation tabs + pipeline status -->
  <nav class="app-nav">
    <ul class="nav-list">
      <li class="nav-item">
        <button class="nav-btn active" data-view="Total">
          <span class="label"><i data-lucide="database"></i> Total</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-btn" data-view="Sample Track">
          <span class="label"><i data-lucide="package"></i> Sample Track</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-btn" data-view="DNA Status">
          <span class="label"><i data-lucide="dna"></i> DNA & RNA Status</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-btn" data-view="Library Preparation">
          <span class="label"><i data-lucide="flask-conical"></i> Library Prep</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-btn" data-view="Tertiary Analysis">
          <span class="label"><i data-lucide="bar-chart-3"></i> Data Transfer</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-btn" data-view="Data Upload">
          <span class="label"><i data-lucide="cloud-upload"></i> Data Upload</span>
        </button>
      </li>
    </ul>

    <!-- Batch selector + pipeline status badge + go-to button (right of nav) -->
    <div class="nav-right">
      <div class="batch-bar pipeline-section" id="pipeline-section" style="display:none">
        <select id="pipeline-batch-select" class="pipeline-select"></select>
      </div>
      <div id="pipeline-status-display" class="nav-status-slot"></div>
    </div>
  </nav>

  <main class="main-content">
    <!-- Toolbar: search + actions + live sync status -->
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search-container">
          <i data-lucide="search" class="search-icon"></i>
          <input type="text" id="global-search" class="search-input" placeholder="Search across all columns...">
          <button class="btn-search-exec" id="btn-search-trigger">
            <i data-lucide="arrow-right"></i>
          </button>
        </div>
      </div>

      <div class="toolbar-right">
        <button id="btn-reset-dt" onclick="resetDTTestData()"
          style="display:none; align-items:center; gap:7px; padding:8px 16px; background:#fff5f5; color:#dc2626; border:1.5px solid #fecaca; border-radius:50px; font-family:inherit; font-size:0.82rem; font-weight:500; cursor:pointer; transition:all .2s;">
          <i data-lucide="rotate-ccw" style="width:13px;height:13px;"></i> Reset Test Data
        </button>

        <button class="btn-send-email" id="btn-send-email" style="display:none">
          <i data-lucide="mail"></i>
          Send Email
        </button>

        <button class="btn-filter" id="btn-toggle-filter">
          <i data-lucide="filter"></i>
          Filters
        </button>

        <div class="download-wrapper" id="download-wrapper" style="display:none; position:relative;">
          <button class="btn-filter" id="btn-download">
            <i data-lucide="download"></i>
            Download
          </button>
          <div class="download-dropdown" id="download-dropdown">
            <div class="download-dropdown-header">Select Batch</div>
            <div id="download-batch-list"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="table-container" id="table-view">
      <div class="empty-state">
        <i data-lucide="upload-cloud"></i>
        <h2>Ready to Track</h2>
        <p>Please upload an Excel file to begin viewing and filtering sample data.</p>

  <script>
    // --- LIVE SHEET CONFIG ---
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwK-Rag7h8F44CgqRBJ197wTv2jmGi8EdJDp8dQ5j-mOvLDhaT8iTDbi6sh-ZLKXBBb/exec';

    // --- DEBUG LOG (console only) ---
    function debugLog(msg, isError) {
      if (isError) console.error(msg); else console.log(msg);
    }
    window.addEventListener('error', e => debugLog('JS error: ' + e.message + ' @ ' + e.filename + ':' + e.lineno, true));
    window.addEventListener('unhandledrejection', e => debugLog('Unhandled promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason), true));
    const EMAIL_TO = 'jeevav936@gmail.com';
    const EMAIL_CC = 'andersonreportautomation@gmail.com';
    const REFRESH_INTERVAL_MS = 60 * 1000; // 1 minute
    const FILE_INDEX_REFRESH_MS = 5 * 60 * 1000; // 5 minutes


    // --- FILTER CONFIG ---
    const FILTER_CONFIG = [
      { label: "Batch", col: "Batch", type: "dropdown" },
      { label: "Anderson ID", col: "Anderson ID", type: "text" },
      { label: "Sample Number", col: "Sample Number", type: "text" },
      { label: "Test", col: "Test", type: "dropdown" },
      { label: "Client", col: "Client", type: "dropdown" },
      { label: "Received Date", col: "Received Date", type: "date" },
      { label: "Sample QC Sharing Date", col: "Sample QC Sharing Date", type: "date" },
      { label: "Library QC Sharing Date", col: "Library QC Sharing Date", type: "date" },
      { label: "Date of Sequencing", col: "Date of Sequencing", type: "date" },
      { label: "Date of Transferring Data", col: "Date of Transferring Data", type: "date" },
      { label: "DNA Conc (Qubit)", col: "DNA Conc (Qubit)", type: "text" },
      { label: "RNA Conc (Qubit)", col: "RNA Conc (Qubit)", type: "text" },
      { label: "Name of the Kit", col: "Name of the Kit", type: "dropdown" }
    ];

    const CACHE_KEY = 'wetlab_data_v1';

    const VIEWS = {
      'Total': null,
      'Sample Track': ["Batch", "Sample Number", "Anderson ID", "Test", "Client", "Received Date", "Received Status", "Sample Type"],
      'DNA Status': ["Batch", "Sample Number", "DNA Conc (Qubit)", "DNA conc after bead purification (Qubit)", "RNA Conc (Qubit)", "Sample QC Sharing Date", "Name of the Kit", "DNA & RNA QC Status", "__PPT__", "__MAIL_SENT__"],
      'Library Preparation': ["Batch", "Sample Number", "Library Concentration", "Library QC Sharing Date", "Date of Sequencing", "__PPT__", "__MAIL_SENT__"],
      'Tertiary Analysis': ["Batch", "Sample Number", "Date of Transferring Data", "Remarks", "__DIRECTORY__", "__FILE__", "__MAIL_SENT__"],
      'Data Upload': ["Batch", "Sample Number", "__JOB_ID__", "__IMG_UPLOAD__", "__MAIL_SENT_DU__"]
    };

    // State
    let rawData = [];
    let headerMap = {}; // normalized -> actual
    let currentView = 'Total';
    let activeFilters = {};
    let globalSearchTerm = '';
    let frozenCols = parseInt(localStorage.getItem('frozenCols') || '0');
    let currentColWidthPx = [];

    const normalize = str => String(str).toLowerCase().replace(/[^a-z0-9]/g, '');

    function debounce(fn, wait) {
      let timeout;
      return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn(...args), wait);
      };
    }

    const getColWidth = (col) => {
      const name = col.toLowerCase();
      if (name.includes('remark')) return '400px';
      if (name.includes('detail')) return '400px';
      if (name.includes('anderson')) return '220px';
      if (name.includes('name')) return '250px';
      if (name.includes('client')) return '200px';
      if (name.includes('date')) return '180px';
      return '150px';
    };

    // Elements
    const tableView = document.getElementById('table-view');
    const filterDrawer = document.getElementById('filter-drawer');
    const filterInputs = document.getElementById('filter-inputs');
    const syncTime = document.getElementById('sync-time');
    const statusDot = document.getElementById('status-dot');
    const globalSearch = document.getElementById('global-search');
    const loader = document.getElementById('loader');
    const errorBanner = document.getElementById('app-error-banner');
    const errorMsgEl = document.getElementById('app-error-msg');

    function showAppError(message) {
      errorMsgEl.textContent = message;
      errorBanner.classList.add('visible');
    }
    function hideAppError() {
      errorBanner.classList.remove('visible');
    }
    document.getElementById('app-error-close').addEventListener('click', hideAppError);

    lucide.createIcons();

    // --- LIVE SHEET FETCH ---

    function processSheetRows(rows) {
      rawData = rows.map(row => {
        const clean = {};
        Object.keys(row).forEach(k => {
          let v = (row[k] === null || row[k] === undefined) ? '' : String(row[k]);
          if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(v.trim())) v = v.replace(/\//g, '-');
          clean[k] = v;
        });
        return clean;
      });

      if (rawData.length > 0) {
        const fillCols = Object.keys(rawData[0]).filter(k => normalize(k).includes('batch'));
        fillCols.forEach(col => {
          let last = '';
          rawData.forEach(row => {
            if (String(row[col]).trim() !== '') last = row[col];
            else if (last) row[col] = last;
          });
        });
        const batchCol = fillCols[0];
        if (batchCol) {
          const batchNum = val => parseInt(String(val).replace(/\D/g, ''), 10) || 0;
          rawData.sort((a, b) => batchNum(b[batchCol]) - batchNum(a[batchCol]));
        }
      }

      if (rawData.length > 0) {
        const emptyKeys = Object.keys(rawData[0]).filter(k => k.trim() === '');
        if (emptyKeys.length > 0) {
          rawData = rawData.map(row => {
            const clean = { ...row };
            emptyKeys.forEach(k => delete clean[k]);
            return clean;
          });
        }
      }

      headerMap = {};
      if (rawData.length > 0) {
        Object.keys(rawData[0]).forEach(key => {
          if (key.trim()) headerMap[normalize(key)] = key;
        });
      }

      // Normalize batch identity — source data has inconsistent trailing
      // whitespace (e.g. "Batch 20 " vs "Batch 20"), which otherwise splits a
      // single batch into two identities and writes per-batch meta keys
      // (mailSent*, jobId, dirInput, …) under mismatched names. That made
      // finished batches read as unfinished and unfinished ones read as done.
      const batchActual = headerMap[normalize('Batch')];
      if (batchActual) {
        rawData.forEach(row => { row[batchActual] = String(row[batchActual] || '').trim(); });
      }

      const receivedActual = headerMap['receiveddate'];
      if (receivedActual) {
        rawData.forEach(row => {
          row['Received Status'] = String(row[receivedActual]).trim() ? 'Received' : 'Not Received';
        });
        headerMap['receivedstatus'] = 'Received Status';
      }
    }

    async function loadLiveSheet(showLoader = true, includeFiles = true) {
      // Render immediately from cache so the UI appears before the network responds.
      if (showLoader) {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          try {
            const c = JSON.parse(cached);
            processSheetRows(c.rows || []);
            applyRemoteMeta(c.meta || {});
            if (includeFiles) applyFileIndex(c.files || {});
            unseedOldBatches(); // sets remoteMeta['mailResetAt'] synchronously before renderApp
            renderApp();
            syncTime.textContent = 'Refreshing…';
          } catch (e) { localStorage.removeItem(CACHE_KEY); loader.style.display = 'flex'; }
        } else {
          loader.style.display = 'flex';
        }
      }
      try {
        const url = APPS_SCRIPT_URL + '?action=getAll' + (includeFiles ? '' : '&includeFiles=0');
        const resp = await fetch(url, { redirect: 'follow' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const all = await resp.json();
        if (all.error) throw new Error(all.error);
        // Defense in depth: even if the backend didn't flag an error, refuse to
        // render data that doesn't look like the tracker sheet (e.g. the hidden
        // _meta key/value sheet got served instead of the real data). Normalize
        // keys the same tolerant way the rest of the app matches headers, since
        // a real header can have stray casing/whitespace.
        if (all.rows && all.rows.length > 0 && !Object.keys(all.rows[0]).some(k => normalize(k) === normalize('Batch'))) {
          throw new Error('Backend returned unexpected data (missing "Batch" column) — check that the "Sheet1" tab is the correct data sheet.');
        }

        if (includeFiles) {
          try { localStorage.setItem(CACHE_KEY, JSON.stringify(all)); } catch (e) { }
        } else {
          try {
            const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
            cached.rows = all.rows || [];
            cached.meta = all.meta || cached.meta || {};
            localStorage.setItem(CACHE_KEY, JSON.stringify(cached));
          } catch (e) { }
        }

        processSheetRows(all.rows || []);
        applyRemoteMeta(all.meta || {});
        if (includeFiles && all.files) applyFileIndex(all.files || {});

        await unseedOldBatches();

        statusDot.classList.add('active');
        syncTime.textContent = `Synced: ${new Date().toLocaleTimeString()}`;
        hideAppError();
        renderApp();
      } catch (err) {
        statusDot.classList.remove('active');
        syncTime.textContent = 'Sync failed';
        console.error('Live sheet error:', err);
        showAppError('Tracker sync failed: ' + err.message);
      } finally {
        loader.style.display = 'none';
      }
    }

    // Auto-refresh every 1 minute; file index refresh every 5 minutes.
    loadLiveSheet();
    setInterval(() => loadLiveSheet(false, false), REFRESH_INTERVAL_MS);
    setInterval(() => loadLiveSheet(false, true), FILE_INDEX_REFRESH_MS);

    document.getElementById('btn-sync').addEventListener('click', () => loadLiveSheet(true, true));

    async function seedMailSentForOldBatches() {
      // Seeding disabled — mail triggers are now active for all batches.
    }

    async function unseedOldBatches() {
      // One-time: record a reset timestamp so metaGet ignores all old 'Mail sent'
      // strings that predate it. Runs once — after that mailResetAt is in the backend.
      if (remoteMeta['mailResetAt'] || localStorage.getItem('mailResetAt')) return;
      try {
        await metaSet('mailResetAt', String(Date.now()));
      } catch (err) {
        console.error('Mail reset failed:', err);
      }
    }

    function renderApp() {
      renderTable();
      generateFilterUI();
      populateDownloadDropdown();
      updateEmailButton(currentView);
      updatePipelinePanel();
      // Data-transfer emails check on every sync (lightweight — no file download needed)
      checkAndSendDataTransferEmails();
      // PPT emails are NOT checked here — they run once after the full backend fetch
      // (see loadLiveSheet) so we don't attempt Drive downloads on every 60s refresh.
    }

    function getFilteredData() {
      let data = [...rawData];
      if (globalSearchTerm) {
        const term = globalSearchTerm.toLowerCase();
        data = data.filter(row => Object.values(row).some(v => String(v).toLowerCase().includes(term)));
      }
      Object.keys(activeFilters).forEach(col => {
        const val = activeFilters[col].toLowerCase();
        data = data.filter(row => String(row[col] || '').toLowerCase().includes(val));
      });
      return data;
    }

    // Reorder columns so "Sample Number" is first (or after S.No if present)
    function ensureSampleNumberFirst(colList) {
      const sampleNumNorm = normalize('Sample Number');
      const snoNorm = normalize('S.No');

      const sampleIdx = colList.findIndex(c => normalize(c) === sampleNumNorm);
      if (sampleIdx <= 0) return colList; // already first or not present

      const reordered = colList.filter((_, i) => i !== sampleIdx);
      // Check if S.No (or similar) is the first column
      const hasSno = reordered.length > 0 &&
        (normalize(reordered[0]) === snoNorm ||
          normalize(reordered[0]).startsWith('sno') ||
          normalize(reordered[0]) === 'slno' ||
          normalize(reordered[0]) === 'serialnumber');

      const insertAt = hasSno ? 1 : 0;
      reordered.splice(insertAt, 0, colList[sampleIdx]);
      return reordered;
    }

    function computeBatchStatus(batch) {
      const batchCol = headerMap[normalize('Batch')];
      const qcCol = headerMap[normalize('QC Status')];
      const libDateCol = headerMap[normalize('Library QC Sharing Date')];
      const dtDateCol = headerMap[normalize('Date of Transferring Data')];
      const batchRows = rawData.filter(r => String(r[batchCol] || '') === batch);

      if (metaGet('mailSentDU_' + batch))
        return { label: 'Processing Complete', sub: null, tab: null, color: 'complete' };

      if (metaGet('mailSentDT_' + batch) ||
        (dtDateCol && batchRows.some(r => String(r[dtDateCol] || '').trim())))
        return { label: 'Data Transfer Complete', sub: 'Data Upload in Progress', tab: 'Data Upload', color: 'pipeline-active' };

      if (metaGet('mailSentLib_' + batch) ||
        (libDateCol && batchRows.some(r => String(r[libDateCol] || '').trim())))
        return { label: 'Library Prep Complete', sub: 'Data Transfer in Progress', tab: 'Tertiary Analysis', color: 'pipeline-active' };

      if (qcCol && batchRows.some(r => String(r[qcCol] || '').trim().toLowerCase().includes('fail')))
        return { label: 'QC Failed', sub: 'Request for Repeat Sample', tab: 'DNA Status', color: 'fail' };

      if (qcCol && batchRows.length > 0 && batchRows.every(r => String(r[qcCol] || '').trim().toLowerCase().includes('pass')))
        return { label: 'DNA & RNA QC Complete', sub: 'Library Preparation in Progress', tab: 'Library Preparation', color: 'qc-active' };

      return { label: 'DNA & RNA QC — Under Process', sub: null, tab: 'DNA Status', color: 'processing' };
    }

    function renderStatusCell(batch) {
      const { label, sub, tab, color } = computeBatchStatus(batch);
      const tabLabel = tab === 'Tertiary Analysis' ? 'Data Transfer' : tab;
      const btn = tab ? `<button class="btn-goto-tab" data-gotoview="${tab}">Go to ${tabLabel} &rarr;</button>` : '';
      return `<td rowspan="ROWSPAN_PLACEHOLDER">
      <div class="pipeline-status">
        <span class="pipeline-badge ${color}">${label}</span>
        ${sub ? `<span style="font-size:0.67rem;color:var(--text-muted);font-style:italic;">${sub}</span>` : ''}
        ${btn}
      </div>
    </td>`;
    }

    function renderQCCell(val) {
      const v = String(val || '').trim();
      const lo = v.toLowerCase();
      if (!v) return `<td><span class="qc-under-process">Under Process</span></td>`;
      if (lo.includes('pass')) return `<td><span class="qc-pass">QC Passed</span></td>`;
      if (lo.includes('fail')) return `<td><div class="qc-fail">QC Failed</div><div class="qc-repeat">Request for Repeat Sample</div></td>`;
      return `<td>${v}</td>`;
    }

    function renderTable() {
      const data = getFilteredData();
      // Footer sample count (display only)
      const _sc = document.getElementById('sample-count');
      if (_sc) _sc.textContent = `Showing ${data.length} of ${rawData.length} samples`;
      if (rawData.length === 0) return;

      let requestedCols = VIEWS[currentView] || Object.keys(rawData[0]);
      requestedCols = ensureSampleNumberFirst(requestedCols);

      const isFileCol = req => req === '__FILE__';
      const isPPTCol = req => req === '__PPT__';
      const isMailSentCol = req => req === '__MAIL_SENT__';
      const isDirCol = req => req === '__DIRECTORY__';
      const hasFileCol = requestedCols.includes('__FILE__');
      const hasPPTCol = requestedCols.includes('__PPT__');
      const hasStatusCol = requestedCols.includes('__STATUS__');

      const actualCols = [];
      const displayNames = [];

      requestedCols.forEach(req => {
        if (isFileCol(req)) { actualCols.push('__FILE__'); displayNames.push('File'); return; }
        if (isPPTCol(req)) { actualCols.push('__PPT__'); displayNames.push('PPT Upload'); return; }
        if (isMailSentCol(req)) { actualCols.push('__MAIL_SENT__'); displayNames.push('Mail Sent'); return; }
        if (isDirCol(req)) { actualCols.push('__DIRECTORY__'); displayNames.push('Directory'); return; }
        if (req === '__JOB_ID__') { actualCols.push('__JOB_ID__'); displayNames.push('Job ID'); return; }
        if (req === '__IMG_UPLOAD__') { actualCols.push('__IMG_UPLOAD__'); displayNames.push('Image'); return; }
        if (req === '__MAIL_SENT_DU__') { actualCols.push('__MAIL_SENT_DU__'); displayNames.push('Mail Sent'); return; }
        if (req === '__STATUS__') { actualCols.push('__STATUS__'); displayNames.push('Pipeline Status'); return; }
        // "DNA & RNA QC Status" is the display alias for the sheet's "QC Status" column
        const actual = headerMap[normalize(req)] || (normalize(req) === normalize('DNA & RNA QC Status') ? headerMap[normalize('QC Status')] : null);
        if (actual) {
          actualCols.push(actual);
          displayNames.push(req);
        } else if (currentView === 'Total' || normalize(req) === 'directory') {
          // Show Directory column even if not yet in sheet (shows empty until added)
          actualCols.push(req);
          displayNames.push(req);
        }
      });

      if (data.length === 0) {
        tableView.innerHTML = `<div class="empty-state"><i data-lucide="search-x"></i><p>No matches found.</p></div>`;
        lucide.createIcons();
        return;
      }

      // Build column widths for sticky freeze offset calculation
      currentColWidthPx = displayNames.map(col => {
        if (col === 'Job ID' || col === 'Image' || col === 'Mail Sent' || col === 'PPT Upload') return 200;
        if (col === 'Directory') return 220;
        if (col === 'File') return 170;
        const n = col.toLowerCase();
        if (n.includes('remark') || n.includes('detail')) return 400;
        if (n.includes('anderson')) return 220;
        if (n.includes('name')) return 250;
        if (n.includes('client')) return 200;
        if (n.includes('date')) return 180;
        return 150;
      });

      let html = `<table><colgroup>`;
      displayNames.forEach(col => {
        if (col === 'Job ID') html += `<col style="width:200px">`;
        else if (col === 'Image') html += `<col style="width:200px">`;
        else if (col === 'Mail Sent' && currentView === 'Data Upload') html += `<col style="width:200px">`;
        else if (col === 'Directory') html += `<col style="width:220px">`;
        else if (col === 'File') html += `<col style="width:170px">`;
        else if (col === 'PPT Upload') html += `<col style="width:200px">`;
        else if (col === 'Mail Sent') html += `<col style="width:200px">`;
        else html += `<col style="width:${getColWidth(col)}">`;
      });
      html += `</colgroup><thead><tr>`;

        const pinClass = i < frozenCols ? ' frozen' : '';
        html += `<th><span style="padding-right:20px">${c}</span><button class="col-freeze-pin${pinClass}" data-col="${i}" title="${i === frozenCols - 1 ? 'Unfreeze columns' : 'Freeze up to here'}"></button></th>`;

      html += `</tr></thead><tbody>`;

      const hasVirtualCols = hasFileCol || hasPPTCol || hasStatusCol || currentView === 'Data Upload';
      if (hasVirtualCols) {
        // Group consecutive rows by batch for rowspan merging
        const batchActual = headerMap[normalize('Batch')] || '';
        const groups = [];
        data.forEach(row => {
          const b = String(row[batchActual] || '');
          const last = groups[groups.length - 1];
          if (last && last.batch === b) last.rows.push(row);
          else groups.push({ batch: b, rows: [row] });
        });

        groups.forEach(({ batch, rows }) => {
          const isLibTab = currentView === 'Library Preparation';
          const isDNATab = currentView === 'DNA Status';
          const isDTTab = currentView === 'Tertiary Analysis';
          const fileKey = isDNATab ? 'dna_' + batch : isLibTab ? 'lib_' + batch : batch;
          const files = batchFileMap[fileKey] || [];
          const pptKey = isLibTab ? batch + '::lib' : batch;
          const mailSentLS = isDTTab ? 'mailSentDT_' + batch : (isLibTab ? 'mailSentLib_' + batch : 'mailSent_' + batch);

          const fileListHtml = files.map(name =>

          const fileCellHtml = `
          <td class="file-col" rowspan="${rows.length}">
            <div class="batch-file-cell">
              <input type="file" class="batch-file-input" data-batch="${fileKey}"
                accept=".xlsx,.xls,.csv,.ppt,.pptx,.pdf" multiple style="display:none">
              <button class="btn-batch-upload" data-batch="${fileKey}">↑ Add Files</button>
              <button class="btn-batch-show-dl" data-batch="${fileKey}"
                ${files.length === 0 ? 'disabled style="opacity:0.4;cursor:not-allowed"' : ''}>
                ↓ Download${files.length > 0 ? ` (${files.length})` : ''}
              </button>
              <div style="display:flex;flex-direction:column;gap:3px;margin-top:4px;">${fileListHtml}</div>
            </div>
          </td>`;

          const pptCellHtml = `
          <td class="ppt-col" rowspan="${rows.length}">
            <div class="ppt-cell">
              <input type="file" class="ppt-file-input" data-batch="${pptKey}" accept=".pptx,.ppt,.pdf" style="display:none">
              <button class="btn-ppt-upload" data-batch="${pptKey}">↑ ${pptName ? 'Re-upload' : 'Upload PPT/PDF'}</button>
              ${pptName
              ? `<div class="ppt-filename" title="${pptName}">${pptName}</div>
                   <button class="btn-ppt-dl" data-batch="${pptKey}">↓ Download</button>
                   <button class="btn-ppt-del" data-batch="${pptKey}">✕ Remove</button>`
              : `<button class="btn-ppt-dl" data-batch="${pptKey}" disabled style="opacity:0.35;cursor:not-allowed;">↓ Download</button>`
            }
            </div>
          </td>`;

          const mailSentValue = metaGet(mailSentLS) || '';
          const mailSentHtml = `
          <td class="mail-sent-col" rowspan="${rows.length}">
            <div class="mail-sent-cell${mailSentValue ? '' : ' pending'}">${mailSentValue ? 'Mail sent' : '—'}</div>
          </td>`;

          const dirSavedValue = metaGet('dirInput_' + batch) || '';
          const dirCellHtml = `
          <td class="dir-col" rowspan="${rows.length}">
            <textarea class="dir-input" data-batch="${batch}" placeholder="Enter folder path…">${dirSavedValue}</textarea>
          </td>`;

          // Data Upload virtual cells
          const duImgFiles = batchFileMap['du_' + batch] || [];
          const mailSentDU = metaGet('mailSentDU_' + batch) || '';

          // Build pre-filled Job ID template — always use format if not already set
          let jobIdSaved = metaGet('jobId_' + batch) || '';
          const hasFormat = jobIdSaved.toLowerCase().includes('variantplex') || jobIdSaved.toLowerCase().includes('fusionplex');
          if (!hasFormat) {
            const bCol = headerMap[normalize('Batch')];
            const stCol = headerMap[normalize('Sample Type')];
            const snCol = headerMap[normalize('Sample Number')];
            if (bCol) {
              const bRows = rawData.filter(r => String(r[bCol] || '') === batch);
              const hasDNA = bRows.some(r => stCol ? String(r[stCol] || '').toUpperCase().includes('DNA') : String(r[snCol] || '').includes('MP'));
              const hasRNA = bRows.some(r => stCol ? String(r[stCol] || '').toUpperCase().includes('RNA') : String(r[snCol] || '').includes('FG'));
              const lines = [];
              if (hasDNA) lines.push(`${batch} DNA Variantplex - Job id: `);
              if (hasRNA) lines.push(`${batch} RNA Fusionplex - Job id: `);
              jobIdSaved = lines.join('\n');
              metaSet('jobId_' + batch, jobIdSaved);
            }
          }

          const jobIdHtml = `
          <td class="jobid-col" rowspan="${rows.length}" onclick="event.stopPropagation()">
            <textarea class="jobid-input" data-batch="${batch}" rows="3" placeholder="Enter Job IDs...">${jobIdSaved}</textarea>
          </td>`;
          const imgFileListHtml = duImgFiles.map(name =>
            `<div style="display:flex;align-items:center;gap:4px;background:#f0f9ff;border-radius:5px;padding:3px 6px;font-size:0.7rem;">
            <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px;" title="${name}">🖼 ${name}</span>
            <button class="img-thumb-del" data-batch="du_${batch}" data-name="${name}" style="background:#dc2626;color:#fff;border:none;border-radius:4px;padding:1px 5px;cursor:pointer;font-size:0.7rem;flex-shrink:0;">✕</button>
          </div>`).join('');
          const imgUploadHtml = `
          <td class="img-col" rowspan="${rows.length}">
            <div class="img-cell">
              <input type="file" class="du-img-input" data-batch="${batch}" accept="image/*" multiple style="display:none">
              <button class="btn-img-upload" data-batch="${batch}">📷 Upload Images${duImgFiles.length > 0 ? ' (' + duImgFiles.length + ')' : ''}</button>
              <div style="display:flex;flex-direction:column;gap:3px;margin-top:4px;">${imgFileListHtml}</div>
            </div>
          </td>`;
          const mailSentDUHtml = `
          <td class="mail-sent-du-col" rowspan="${rows.length}">
            <div class="mail-sent-cell${mailSentDU ? '' : ' pending'}">${mailSentDU ? 'Mail sent' : '—'}</div>
          </td>`;
          const statusCellHtml = renderStatusCell(batch).replace('ROWSPAN_PLACEHOLDER', rows.length);

          rows.forEach((row, idx) => {
            html += '<tr>';
            actualCols.forEach((c, i) => {
              if (c === '__FILE__') {
                if (idx === 0) html += fileCellHtml;
              } else if (c === '__PPT__') {
                if (idx === 0) html += pptCellHtml;
              } else if (c === '__MAIL_SENT__') {
                if (idx === 0) html += mailSentHtml;
              } else if (c === '__DIRECTORY__') {
                if (idx === 0) html += dirCellHtml;
              } else if (c === '__JOB_ID__') {
                if (idx === 0) html += jobIdHtml;
              } else if (c === '__IMG_UPLOAD__') {
                if (idx === 0) html += imgUploadHtml;
              } else if (c === '__MAIL_SENT_DU__') {
                if (idx === 0) html += mailSentDUHtml;
              } else if (c === '__STATUS__') {
                if (idx === 0) html += statusCellHtml;
              } else if (normalize(displayNames[i]) === 'receivedstatus') {
                const val = row[c] || '';
                const color = val === 'Received' ? '#059669' : '#dc2626';
                html += `<td style="color:${color};font-weight:700">${val}</td>`;
              } else if (c === headerMap[normalize('QC Status')]) {
                html += renderQCCell(row[c]);
              } else {
                html += `<td>${row[c] || ''}</td>`;
              }
            });
            html += '</tr>';
          });
        });
      } else {
        data.forEach(row => {
          html += `<tr>${actualCols.map((c, i) => {
            const val = row[c] || '';
            if (normalize(displayNames[i]) === 'receivedstatus') {
              const color = val === 'Received' ? '#059669' : '#dc2626';
              return `<td style="color:${color};font-weight:700">${val}</td>`;
            }
            if (c === headerMap[normalize('QC Status')]) return renderQCCell(val);
            return `<td>${val}</td>`;
          }).join('')}</tr>`;
        });
      }

      html += `</tbody></table>`;
      tableView.innerHTML = html;
      applyFreezeStyles();

      // Event handlers for dynamic table controls are attached once globally via
      // attachTableEventHandlers() outside renderTable().
    }

    function attachTableEventHandlers() {
      tableView.addEventListener('click', async (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;

        if (btn.classList.contains('btn-batch-upload')) {
          const input = btn.closest('.batch-file-cell')?.querySelector('.batch-file-input');
          if (input) input.click();
          return;
        }

        if (btn.classList.contains('btn-batch-show-dl')) {
          if (btn.disabled) return;
          e.stopPropagation();
          openFilePopover(btn.dataset.batch, btn);
          return;
        }

        if (btn.classList.contains('btn-img-upload')) {
          const input = btn.closest('.img-cell')?.querySelector('.du-img-input');
          if (input) input.click();
          return;
        }

        if (btn.classList.contains('batch-file-del')) {
          await deleteBatchSingleFile(btn.dataset.batch, btn.dataset.name);
          renderTable();
          return;
        }

        if (btn.classList.contains('img-thumb-del')) {
          await deleteBatchSingleFile(btn.dataset.batch, btn.dataset.name);
          renderTable();
          return;
        }

        if (btn.classList.contains('btn-ppt-upload')) {
          const input = btn.closest('.ppt-cell')?.querySelector('.ppt-file-input');
          if (input) {
            input.value = '';
            input.click();
          }
          return;
        }

        if (btn.classList.contains('btn-ppt-dl')) {
          try {
            const rec = await getPPT(btn.dataset.batch);
            if (!rec) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([rec.data]));
            a.download = rec.fileName;
            a.click();
            URL.revokeObjectURL(a.href);
          } catch (err) {
            console.error('PPT download failed:', err);
            alert('Download failed: ' + (err && err.message ? err.message : err));
          }
          return;
        }

        if (btn.classList.contains('btn-ppt-del')) {
          if (!confirm('Remove PPT for ' + btn.dataset.batch + '?')) return;
          try {
            await deletePPT(btn.dataset.batch);
            renderTable();
          } catch (err) {
            console.error('PPT delete failed:', err);
            alert('Delete failed: ' + (err && err.message ? err.message : err));
          }
          return;
        }
      });

      tableView.addEventListener('change', async (e) => {
        const target = e.target;
        if (target.classList.contains('batch-file-input')) {
          const filesToUpload = [...target.files];
          const uploadBtn = target.closest('.batch-file-cell')?.querySelector('.btn-batch-upload');
          const originalLabel = uploadBtn ? uploadBtn.innerHTML : '';
          if (uploadBtn) { uploadBtn.disabled = true; uploadBtn.innerHTML = `⏳ 0 / ${filesToUpload.length} uploaded`; }
          let doneCount = 0;
          try {
            await Promise.all(filesToUpload.map(async (file) => {
              const buf = await file.arrayBuffer();
              await addBatchFile(target.dataset.batch, file.name, buf);
              doneCount++;
              if (uploadBtn) uploadBtn.innerHTML = `⏳ ${doneCount} / ${filesToUpload.length} uploaded`;
            }));
            renderTable();
            if (isDTReadyToSend(target.dataset.batch) && !metaGet('mailSentDT_' + target.dataset.batch)) {
              await autoSendDataTransferEmail(target.dataset.batch);
            }
          } catch (err) {
            console.error('Batch file upload failed:', err);
            alert('Upload failed: ' + (err && err.message ? err.message : err) + '\n\nCheck the browser console for details.');
            if (uploadBtn) { uploadBtn.disabled = false; uploadBtn.innerHTML = originalLabel; }
          }
          return;
        }

        if (target.classList.contains('du-img-input')) {
          const filesToUpload = [...target.files];
          const uploadBtn = target.closest('.img-cell')?.querySelector('.btn-img-upload');
          const originalLabel = uploadBtn ? uploadBtn.innerHTML : '';
          if (uploadBtn) { uploadBtn.disabled = true; uploadBtn.innerHTML = `⏳ 0 / ${filesToUpload.length} uploaded`; }
          let doneCount = 0;
          try {
            await Promise.all(filesToUpload.map(async (file) => {
              const buf = await file.arrayBuffer();
              await addBatchFile('du_' + target.dataset.batch, file.name, buf);
              doneCount++;
              if (uploadBtn) uploadBtn.innerHTML = `⏳ ${doneCount} / ${filesToUpload.length} uploaded`;
            }));
            renderTable();
            if (isDUReadyToSend(target.dataset.batch) && !metaGet('mailSentDU_' + target.dataset.batch)) {
              await autoSendDataUploadEmail(target.dataset.batch);
            }
          } catch (err) {
            console.error('Image upload failed:', err);
            alert('Upload failed: ' + (err && err.message ? err.message : err) + '\n\nCheck the browser console for details.');
            if (uploadBtn) { uploadBtn.disabled = false; uploadBtn.innerHTML = originalLabel; }
          }
          return;
        }

        if (target.classList.contains('ppt-file-input')) {
          const file = target.files[0];
          if (!file) return;
          const pptKey = target.dataset.batch;
          debugLog('PPT upload started: ' + file.name + ' [' + Math.round(file.size / 1024) + ' KB] for ' + pptKey);
          const uploadBtn = target.closest('.ppt-cell')?.querySelector('.btn-ppt-upload');

            renderTable();

            if (uploadBtn) { uploadBtn.disabled = false; uploadBtn.innerHTML = originalLabel; }
            target.value = '';
          }
          return;
        }
      });

        const target = e.target;
        if (target.classList.contains('dir-input')) {
          metaSetDebounced('dirInput_' + target.dataset.batch, target.value);

            await autoSendDataTransferEmail(target.dataset.batch);

        if (target.classList.contains('jobid-input')) {

          if (isDUReadyToSend(target.dataset.batch) && !metaGet('mailSentDU_' + target.dataset.batch)) {
            await autoSendDataUploadEmail(target.dataset.batch);
          }
        }
      });
    }

    function generateFilterUI() {
      if (rawData.length === 0) return;

        const actualCol = headerMap[normalize(col)];
        if (!actualCol) return; // column not present in this Excel, skip

        if (type === 'dropdown') {
          const unique = [...new Set(rawData.map(r => String(r[actualCol] || '')).filter(v => v))].sort((a, b) => {
            const na = parseInt(a.replace(/\D/g, ''), 10), nb = parseInt(b.replace(/\D/g, ''), 10);
            return (isNaN(na) || isNaN(nb)) ? a.localeCompare(b) : nb - na;
          });
          const opts = unique.map(v => `<option value="${v}"${activeFilters[actualCol] === v ? ' selected' : ''}>${v}</option>`).join('');
          html += `
          <div class="filter-group">
            <label>${label}</label>
            <select data-col="${actualCol}">
              <option value="">— All —</option>
              ${opts}
            </select>
          </div>`;
        } else if (type === 'date') {
          html += `
          <div class="filter-group">
            <label>${label}</label>
            <input type="date" data-col="${actualCol}" value="${activeFilters[actualCol] || ''}">
          </div>`;
        } else {
          html += `
          <div class="filter-group">
            <label>${label}</label>
            <input type="text" data-col="${actualCol}" placeholder="Search…" value="${activeFilters[actualCol] || ''}">
          </div>`;
        }
      });

      filterInputs.innerHTML = html || '<p style="color:var(--text-muted)">No filter columns found in this file.</p>';

    async function autoSendDataUploadEmail(batch) {
      if (isBatchSuppressed(batch)) return;
      if (metaGet('mailSentDU_' + batch)) return;
      try {
        const { subject, body } = buildDataUploadEmailPreview(batch);
        // Encode images
        const rec = await getBatchRecord('du_' + batch);
        const files = [];
        if (rec && rec.files.length > 0) {
          for (const f of rec.files) {
            files.push({ name: f.name, base64: await bufferToBase64(f.data) });
          }
        }
        const payload = { action: 'sendDataUploadEmail', batch, customSubject: subject, customBody: body, files, to: EMAIL_TO, cc: EMAIL_CC };
        const resp = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload), redirect: 'follow' });
        const json = await resp.json();
        if (json.error) throw new Error(json.error);
        await metaSet('mailSentDU_' + batch, String(Date.now()));
        renderTable();
      } catch (err) {
        console.error('Auto-send DU failed:', err.message);
      }
    }
