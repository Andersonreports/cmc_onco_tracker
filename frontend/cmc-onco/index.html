    function buildEmailPreview(batch) {
      const batchCol = headerMap[normalize('Batch')];
      const testCol = headerMap[normalize('Test')];
      const receivedCol = headerMap[normalize('Received Date')];
      const tatCol = headerMap[normalize('TAT')];
      if (!batchCol) return { subject: '', body: '' };

      const rows = rawData.filter(r => String(r[batchCol] || '') === batch);
      const total = rows.length;
      const submissionDate = receivedCol ? (rows[0]?.[receivedCol] || '') : '';
      const tatDate = tatCol ? (rows[0]?.[tatCol] || '') : '';
      const sampleNumCol = headerMap[normalize('Sample Number')];
      const qcCol = headerMap[normalize('QC Status')];
      const sampleTypeColKey = headerMap[normalize('Sample Type')];

      const variantCount = rows.filter(r => sampleTypeColKey
        ? String(r[sampleTypeColKey] || '').toUpperCase().includes('DNA')
        : (sampleNumCol && String(r[sampleNumCol] || '').includes('MP'))).length;
      const fusionCount = rows.filter(r => sampleTypeColKey
        ? String(r[sampleTypeColKey] || '').toUpperCase().includes('RNA')
        : (sampleNumCol && String(r[sampleNumCol] || '').includes('FG'))).length;

      // Check QC status for failures — non-empty value that doesn't contain 'pass'
      const failedSamples = qcCol
        ? rows.filter(r => {
          const val = String(r[qcCol] || '').trim().toLowerCase();
          return val !== '' && !val.includes('pass');
        })
        : [];

      const qcLine = failedSamples.length === 0
        ? 'All Samples : QC Passed'
        : failedSamples.map(r => `${sampleNumCol ? r[sampleNumCol] : 'Sample'} is failed. Therefore taken for reanalysis`).join('\n');

      const subject = `${batch} sample information`;
      const body =
        `Dear team,
DNA samples were received from Department of Haematology , CMC Vellore. Quality Control assessment was performed using Qubit and sample order is attached as PDF.

Submission Date: ${submissionDate}
Panel Name/Kit Type: Myeloid ARCHER Variant Plex , FUSION Plex

Total Samples Received: ${total}
Myeloid ARCHER Variant Plex - ${String(variantCount).padStart(2, '0')}
FUSION Plex - ${String(fusionCount).padStart(2, '0')}
${qcLine}

Library sample order , concentration and pooled library tapestation profiles will be shared by ${tatDate} .`;
      return { subject, body, rows, submissionDate };
    }

    // --- CLOUD STORAGE LAYER (Google Drive via Apps Script) ---
    // Replaces the prior browser-local IndexedDB so files and metadata are shared
    // across all users opening the tracker link.
    //
    // pptFileMap[key]    = fileName       — key is '<batch>' or '<batch>::lib'
    // batchFileMap[key]  = [fileName, …]  — key is 'dna_<batch>', 'lib_<batch>', '<batch>' (DT), or 'du_<batch>'
    // fileIdMap[key][name] = driveFileId  — used to download/delete a specific file from Drive
    let batchFileMap = {};
    let pptFileMap = {};
    let fileIdMap = {};
    // Buffer recently-uploaded files for 5 min so Drive's eventual consistency
    // doesn't wipe them from the local maps before the index catches up.
    const UPLOAD_PENDING_TTL_MS = 5 * 60 * 1000;
    const pendingUploads = {}; // key → [{fileName, fileId, ts}]
    const pendingPPT = {}; // pptKey → {fileName, fileId, ts}
    // Buffer recently-deleted files so Drive's eventual consistency doesn't
    // re-inject them into the local maps before the delete propagates.
    const pendingDeletes = {}; // key → [{fileName, ts}]
    const pendingPPTDeletes = {}; // pptKey → ts

    // Persistent set of deleted Drive fileIds. Unlike the in-memory buffers
    // above, this survives a browser refresh, so a file the user removed never
    // reappears — even while Drive's listing is still eventually-consistent or
    // if the delete is slow. It is pruned once the backend stops reporting the id.
    const DELETED_IDS_KEY = 'deletedFileIds_v1';
    let deletedFileIds = new Set();
    try { deletedFileIds = new Set(JSON.parse(localStorage.getItem(DELETED_IDS_KEY) || '[]')); } catch (e) { }
    function persistDeletedIds() {
      try { localStorage.setItem(DELETED_IDS_KEY, JSON.stringify([...deletedFileIds])); } catch (e) { }
    }
    function markFileDeleted(fileId) {
      if (!fileId) return;
      deletedFileIds.add(fileId);
      persistDeletedIds();
    }

    // ArrayBuffer → base64 (kept for the email-send path)
    async function bufferToBase64(buf) {
      const bytes = new Uint8Array(buf);
      const CHUNK = 8192;
      let binary = '';
      for (let i = 0; i < bytes.length; i += CHUNK) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + CHUNK, bytes.length)));
      }
      return btoa(binary);
    }

    function base64ToArrayBuffer(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    // Mirror the backend's sanitizeFolderName so frontend keys match Drive folder names.
    function sanitizeDriveKey(s) {
      return String(s || '').replace(/[\/\\:*?"<>|]/g, '_').trim() || 'unknown';
    }

    // Map a frontend file key to { batch, category } that matches the Drive layout.
    function parseFileKey(key) {
      if (key.startsWith('dna_')) return { batch: key.slice(4), category: 'dna' };
      if (key.startsWith('lib_')) return { batch: key.slice(4), category: 'lib' };
      if (key.startsWith('du_')) return { batch: key.slice(3), category: 'du' };
      return { batch: key, category: 'dt' };
    }
    function parsePptKey(key) {
      if (key.endsWith('::lib')) return { batch: key.slice(0, -5), category: 'lib_ppt' };
      return { batch: key, category: 'ppt' };
    }

    async function apiPost(payload) {
      const label = payload.action + (payload.batch ? ' (' + payload.batch + (payload.category ? '/' + payload.category : '') + ')' : '');
      const sizeKb = payload.base64 ? Math.round(payload.base64.length / 1024) : 0;
      debugLog('POST → ' + label + (sizeKb ? ' [' + sizeKb + ' KB base64]' : ''));
      let resp;
      try {
        resp = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload), redirect: 'follow' });
      } catch (err) {
        debugLog('POST network failure for ' + label + ': ' + err.message, true);
        throw err;
      }
      const text = await resp.text();
      let json;
      try { json = JSON.parse(text); }
      catch (err) {
        debugLog('POST ' + label + ' returned non-JSON (status ' + resp.status + '): ' + text.slice(0, 200), true);
        throw new Error('Non-JSON response from Apps Script (status ' + resp.status + ')');
      }
      if (json.error) {
        debugLog('POST ' + label + ' error: ' + json.error, true);
        throw new Error(json.error);
      }
      debugLog('POST ✓ ' + label);
      return json;
    }
    async function apiGet(params) {
      const qs = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
      const label = params.action || 'GET';
      debugLog('GET  → ' + label);
      let resp;
      try {
        resp = await fetch(APPS_SCRIPT_URL + '?' + qs, { redirect: 'follow' });
      } catch (err) {
        debugLog('GET network failure for ' + label + ': ' + err.message, true);
        throw err;
      }
      const text = await resp.text();
      let json;
      try { json = JSON.parse(text); }
      catch (err) {
        debugLog('GET ' + label + ' returned non-JSON (status ' + resp.status + '): ' + text.slice(0, 200), true);
        throw new Error('Non-JSON response from Apps Script (status ' + resp.status + ')');
      }
      if (json.error) {
        debugLog('GET ' + label + ' error: ' + json.error, true);
        throw new Error(json.error);
      }
      debugLog('GET  ✓ ' + label);
      return json;
    }

    // PPT file functions (cloud-backed)
    async function savePPT(key, fileName, data) {
      const { batch, category } = parsePptKey(key);
      const base64 = await bufferToBase64(data);
      const j = await apiPost({ action: 'uploadFile', batch, category, fileName, base64 });
      pptFileMap[key] = j.fileName;
      if (!fileIdMap[key]) fileIdMap[key] = {};
      fileIdMap[key][j.fileName] = j.fileId;
      pendingPPT[key] = { fileName: j.fileName, fileId: j.fileId, ts: Date.now() };
    }
    async function getPPT(key) {
      const fileName = pptFileMap[key];
      if (!fileName) return null;
      const fileId = (fileIdMap[key] || {})[fileName];
      if (!fileId) return null;
      const j = await apiGet({ action: 'getFile', fileId });
      return { batch: key, fileName: j.fileName, data: base64ToArrayBuffer(j.base64) };
    }
    async function deletePPT(key) {
      const fileName = pptFileMap[key];
      if (!fileName) return;
      const fileId = (fileIdMap[key] || {})[fileName];
      markFileDeleted(fileId);
      if (fileId) await apiPost({ action: 'deleteFile', fileId });
      delete pptFileMap[key];
      if (fileIdMap[key]) delete fileIdMap[key][fileName];
      delete pendingPPT[key];
      pendingPPTDeletes[key] = Date.now();
    }
    async function loadPPTFileMap() {
      // Refresh from cloud — used after uploads/deletes for a single-source-of-truth view.
      await pullRemoteFileIndex();
    }

    // Per-batch multi-file functions (cloud-backed)
    async function addBatchFile(key, fileName, data) {
      const { batch, category } = parseFileKey(key);
      const base64 = await bufferToBase64(data);
      const j = await apiPost({ action: 'uploadFile', batch, category, fileName, base64 });
      if (!batchFileMap[key]) batchFileMap[key] = [];
      batchFileMap[key] = batchFileMap[key].filter(n => n !== j.fileName);
      batchFileMap[key].push(j.fileName);
      if (!fileIdMap[key]) fileIdMap[key] = {};
      fileIdMap[key][j.fileName] = j.fileId;
      // Record as pending so pullRemoteFileIndex won't drop it before Drive catches up.
      if (!pendingUploads[key]) pendingUploads[key] = [];
      pendingUploads[key] = pendingUploads[key].filter(e => e.fileName !== j.fileName);
      pendingUploads[key].push({ fileName: j.fileName, fileId: j.fileId, ts: Date.now() });
    }

    async function getBatchRecord(key) {
      // Maintains the legacy contract: { batch, files: [{name, data: ArrayBuffer}] }
      // by fetching every file's bytes from Drive on demand. Used by the email-send path.
      const names = batchFileMap[key] || [];
      if (names.length === 0) return null;
      const idMap = fileIdMap[key] || {};
      const files = [];
      for (const name of names) {
        const fileId = idMap[name];
        if (!fileId) continue;
        const j = await apiGet({ action: 'getFile', fileId });
        files.push({ name: j.fileName, data: base64ToArrayBuffer(j.base64) });
      }
      return { batch: key, files };
    }

    // Fetch a single file's bytes by name — used by per-file download buttons so we
    // don't pull every file in the batch just to save one.
    async function getSingleBatchFile(key, fileName) {
      const fileId = (fileIdMap[key] || {})[fileName];
      if (!fileId) return null;
      const j = await apiGet({ action: 'getFile', fileId });
      return { name: j.fileName, data: base64ToArrayBuffer(j.base64) };
    }

    async function deleteBatchSingleFile(key, fileName) {
      const fileId = (fileIdMap[key] || {})[fileName];
      markFileDeleted(fileId);
      if (fileId) await apiPost({ action: 'deleteFile', fileId });
      if (batchFileMap[key]) batchFileMap[key] = batchFileMap[key].filter(n => n !== fileName);
      if (fileIdMap[key]) delete fileIdMap[key][fileName];
      // Remove from pending upload buffer so pullRemoteFileIndex won't re-inject the deleted file.
      if (pendingUploads[key]) pendingUploads[key] = pendingUploads[key].filter(e => e.fileName !== fileName);
      // Record as pending delete so Drive's eventual consistency won't re-surface the file.
      if (!pendingDeletes[key]) pendingDeletes[key] = [];
      pendingDeletes[key] = pendingDeletes[key].filter(e => e.fileName !== fileName);
      pendingDeletes[key].push({ fileName, ts: Date.now() });
    }

    async function loadBatchFileMap() {
      await pullRemoteFileIndex();
    }

    function applyFileIndex(raw) {
      const nextPpt = {};
      const nextBatch = {};
      const nextIds = {};

      const batchActual = headerMap[normalize('Batch')] || '';
      const sanitizedToOriginal = {};
      if (batchActual && rawData.length > 0) {
        rawData.forEach(row => {
          const b = String(row[batchActual] || '').trim();
          if (b) {
            const safe = sanitizeDriveKey(b);
            if (!(safe in sanitizedToOriginal)) sanitizedToOriginal[safe] = b;
          }
        });
      }

      Object.keys(raw).forEach(driveBatch => {
        const batch = sanitizedToOriginal[driveBatch] || driveBatch;
        const cats = raw[driveBatch] || {};
        const remember = (key, list) => {
          if (!list || list.length === 0) return;
          nextBatch[key] = list.map(f => f.fileName);
          if (!nextIds[key]) nextIds[key] = {};
          list.forEach(f => { nextIds[key][f.fileName] = f.fileId; });
        };
        remember('dna_' + batch, cats.dna);
        remember('lib_' + batch, cats.lib);
        remember(batch, cats.dt);
        remember('du_' + batch, cats.du);
        // PPT IDs merged after remember() calls so they don't get overwritten by DT files
        // sharing the same batch key in nextIds.
        if ((cats.ppt || []).length > 0) {
          const f = cats.ppt[0];
          nextPpt[batch] = f.fileName;
          if (!nextIds[batch]) nextIds[batch] = {};
          nextIds[batch][f.fileName] = f.fileId;
        }
        if ((cats.lib_ppt || []).length > 0) {
          const f = cats.lib_ppt[0];
          const k = batch + '::lib';
          nextPpt[k] = f.fileName;
          if (!nextIds[k]) nextIds[k] = {};
          nextIds[k][f.fileName] = f.fileId;
        }
      });

      const now = Date.now();

      // Suppress files that were recently deleted — Drive may still list them.
      Object.keys(pendingDeletes).forEach(key => {
        pendingDeletes[key] = pendingDeletes[key].filter(e => now - e.ts < UPLOAD_PENDING_TTL_MS);
        if (pendingDeletes[key].length === 0) { delete pendingDeletes[key]; return; }
        if (!nextBatch[key]) return;
        const deletedSet = new Set(pendingDeletes[key].map(e => e.fileName));
        nextBatch[key] = nextBatch[key].filter(n => !deletedSet.has(n));
        deletedSet.forEach(n => { if (nextIds[key]) delete nextIds[key][n]; });
        if (nextBatch[key].length === 0) delete nextBatch[key];
      });
      Object.keys(pendingPPTDeletes).forEach(key => {
        if (now - pendingPPTDeletes[key] >= UPLOAD_PENDING_TTL_MS) { delete pendingPPTDeletes[key]; return; }
        delete nextPpt[key];
      });

      Object.keys(pendingUploads).forEach(key => {
        pendingUploads[key] = pendingUploads[key].filter(e => now - e.ts < UPLOAD_PENDING_TTL_MS);
        if (pendingUploads[key].length === 0) { delete pendingUploads[key]; return; }
        pendingUploads[key].forEach(({ fileName, fileId }) => {
          if (!nextBatch[key]) nextBatch[key] = [];
          if (!nextBatch[key].includes(fileName)) nextBatch[key].push(fileName);
          if (!nextIds[key]) nextIds[key] = {};
          if (!nextIds[key][fileName]) nextIds[key][fileName] = fileId;
        });
      });
      Object.keys(pendingPPT).forEach(key => {
        const entry = pendingPPT[key];
        if (now - entry.ts >= UPLOAD_PENDING_TTL_MS) { delete pendingPPT[key]; return; }
        if (!nextPpt[key]) {
          nextPpt[key] = entry.fileName;
          if (!nextIds[key]) nextIds[key] = {};
          nextIds[key][entry.fileName] = entry.fileId;
        }
      });

      // Persistently drop any file the user removed (keyed by Drive fileId). This
      // runs last so a deleted file never reappears after a refresh while Drive's
      // listing is still eventually-consistent or the delete is slow/failed.
      if (deletedFileIds.size > 0) {
        const allRawIds = new Set();
        Object.keys(raw).forEach(db => {
          const cats = raw[db] || {};
          Object.keys(cats).forEach(cat => (cats[cat] || []).forEach(f => { if (f.fileId) allRawIds.add(f.fileId); }));
        });
        Object.keys(nextBatch).forEach(key => {
          const ids = nextIds[key] || {};
          nextBatch[key] = nextBatch[key].filter(name => {
            if (ids[name] && deletedFileIds.has(ids[name])) { delete ids[name]; return false; }
            return true;
          });
          if (nextBatch[key].length === 0) delete nextBatch[key];
        });
        Object.keys(nextPpt).forEach(key => {
          const name = nextPpt[key];
          const id = (nextIds[key] || {})[name];
          if (id && deletedFileIds.has(id)) {
            delete nextPpt[key];
            if (nextIds[key]) delete nextIds[key][name];
          }
        });
        // Prune ids the backend no longer reports (delete confirmed). Only when
        // the index actually returned files, so a transient empty response can't
        // wipe the guard.
        if (allRawIds.size > 0) {
          let pruned = false;
          deletedFileIds.forEach(id => { if (!allRawIds.has(id)) { deletedFileIds.delete(id); pruned = true; } });
          if (pruned) persistDeletedIds();
        }
      }

      pptFileMap = nextPpt;
      batchFileMap = nextBatch;
      fileIdMap = nextIds;
    }

    async function pullRemoteFileIndex() {
      applyFileIndex(await apiGet({ action: 'listAllFiles' }));
    }

    // --- SHARED METADATA (Apps Script _meta sheet) ---
    // Replaces localStorage for any key that must be visible to every user of
    // the tracker link (mail-sent timestamps, job IDs, directory inputs).
    let remoteMeta = {};
    const SHARED_META_PREFIXES = ['mailSent_', 'mailSentLib_', 'mailSentDU_', 'mailSentDT_', 'jobId_', 'dirInput_', 'mailResetAt'];
    function isSharedMetaKey(k) {
      return SHARED_META_PREFIXES.some(p => k.startsWith(p));
    }
    function isMailSentKey(k) {
      return k.startsWith('mailSent_') || k.startsWith('mailSentLib_') || k.startsWith('mailSentDU_') || k.startsWith('mailSentDT_');
    }
    function metaGet(key) {
      const val = (isSharedMetaKey(key) && key in remoteMeta) ? remoteMeta[key] : localStorage.getItem(key);
      return val; // any truthy value (old 'Mail sent' string or new timestamp) = already sent
    }
    async function metaSet(key, value) {
      // Set localStorage synchronously FIRST so applyRemoteMeta sees the new value
      // even if it runs during the await below (prevents stale overwrite race).
      localStorage.setItem(key, value);
      if (isSharedMetaKey(key)) {
        remoteMeta[key] = value;
        try { await apiPost({ action: 'setMeta', key, value }); }
        catch (err) { console.error('metaSet failed for ' + key, err); }
      }
    }

    // For input typing — coalesces high-frequency writes so we don't POST per keystroke.
    const _metaDebounceTimers = {};
    function metaSetDebounced(key, value, delayMs = 800) {
      if (isSharedMetaKey(key)) remoteMeta[key] = value;
      localStorage.setItem(key, value);
      clearTimeout(_metaDebounceTimers[key]);
      _metaDebounceTimers[key] = setTimeout(() => {
        if (!isSharedMetaKey(key)) return;
        apiPost({ action: 'setMeta', key, value })
          .catch(err => console.error('metaSetDebounced failed for ' + key, err));
      }, delayMs);
    }
    function applyRemoteMeta(meta) {
      const newMeta = meta || {};
      Object.keys(newMeta).forEach(k => {
        if (!isSharedMetaKey(k)) return;
        if (isMailSentKey(k)) {
          // If localStorage already has any truthy value (sent this session or prev),
          // keep it — the backend may still carry a stale value due to replication lag.
          if (localStorage.getItem(k)) return;
        }
        localStorage.setItem(k, newMeta[k]);
      });
      remoteMeta = newMeta;
    }

    async function pullRemoteMeta() {
      applyRemoteMeta(await apiGet({ action: 'getMeta' }));
    }

    async function pullRemoteState() {
      await Promise.all([
        pullRemoteMeta().catch(err => console.error('Meta pull failed:', err)),
        pullRemoteFileIndex().catch(err => console.error('File index pull failed:', err)),
      ]);
    }

    // --- AUTO SEND EMAIL ON PPT UPLOAD ---
    function getPPTMailSentKey(pptKey) {
      const isLib = pptKey.endsWith('::lib');
      const batch = isLib ? pptKey.replace('::lib', '') : pptKey;
      return isLib ? 'mailSentLib_' + batch : 'mailSent_' + batch;
    }

    // preloadedData / preloadedName: in-memory ArrayBuffer+filename from the upload
    // handler — skips the Drive round-trip and bypasses the "already sent" gate
    // (user explicitly uploaded, so always send). Without these args the function
    // runs in background mode: respects the gate and fetches from Drive.
    async function autoSendEmail(pptKey, preloadedData, preloadedName) {
      const isLib = pptKey.endsWith('::lib');
      const batch = isLib ? pptKey.replace('::lib', '') : pptKey;
      const action = isLib ? 'sendLibraryPrepEmail' : 'sendDNARNAEmail';
      const lsKey = getPPTMailSentKey(pptKey);
      // Background mode only: skip if already sent. Upload-triggered calls always proceed.
      if (!preloadedData && metaGet(lsKey)) return;

      try {
        let pptData, pptName;
        if (preloadedData && preloadedName) {
          pptData = preloadedData;
          pptName = preloadedName;
        } else {
          const pptRec = await getPPT(pptKey);
          if (!pptRec) {
            console.warn('autoSendEmail: no PPT in Drive for', pptKey);
            return;
          }
          pptData = pptRec.data;
          pptName = pptRec.fileName;
        }

        const payload = { action, batch, to: EMAIL_TO, cc: EMAIL_CC };
        payload.pptBase64 = await bufferToBase64(pptData);
        payload.pptName = pptName;

        const resp = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload),
          redirect: 'follow'
        });
        const json = await resp.json();
        if (json.error) throw new Error(json.error);

        await metaSet(lsKey, String(Date.now()));
        renderTable();

      } catch (err) {
        console.error('autoSendEmail failed for ' + batch + ':', err.message);
        if (preloadedData) {
          // Called from the upload handler — show the error so the user knows
          alert('Email send failed for ' + batch + ':\n' + err.message);
        }
      }
    }

    // --- AUTO SEND EMAIL ON DATA TRANSFER FILE UPLOAD ---

    function isBatchSuppressed(batch) {
      return false;
    }

    function isDTReadyToSend(batch) {
      // Both conditions: Directory input is filled AND files are uploaded
      const dirValue = (metaGet('dirInput_' + batch) || '').trim();
      const hasFiles = (batchFileMap[batch] || []).length > 0;
      return dirValue !== '' && hasFiles;
    }

    let _dtEmailsRunning = false;
    async function checkAndSendDataTransferEmails() {
      if (_dtEmailsRunning) return;
      _dtEmailsRunning = true;
      try {
        if (rawData.length === 0) return;
        const batchCol = headerMap[normalize('Batch')];
        if (!batchCol) return;
        const batches = [...new Set(rawData.map(r => String(r[batchCol] || '')).filter(v => v))];
        for (const batch of batches) {
          if (!metaGet('mailSentDT_' + batch) && isDTReadyToSend(batch)) {
            await autoSendDataTransferEmail(batch);
          }
        }
      } finally {
        _dtEmailsRunning = false;
      }
    }

    let _pptEmailsRunning = false;
    async function checkAndSendPPTEmails() {
      if (_pptEmailsRunning) return;
      _pptEmailsRunning = true;
      try {
        for (const pptKey of Object.keys(pptFileMap)) {
          const lsKey = getPPTMailSentKey(pptKey);
          if (metaGet(lsKey)) continue;
          await autoSendEmail(pptKey);
        }
      } finally {
        _pptEmailsRunning = false;
      }
    }

    async function buildDTPayload(batch, customSubject, customBody) {
      const payload = { action: 'sendDataTransferEmail', batch, customSubject, customBody, to: EMAIL_TO, cc: EMAIL_CC };
      // Attach uploaded files from Drive (fetched on demand via getBatchRecord)
      const rec = await getBatchRecord(batch);
      if (rec && rec.files && rec.files.length > 0) {
        payload.files = [];
        for (const f of rec.files) {
          payload.files.push({ name: f.name, base64: await bufferToBase64(f.data) });
        }
      }
      return payload;
    }

    async function autoSendDataTransferEmail(batch) {
      if (isBatchSuppressed(batch)) return;
      if (metaGet('mailSentDT_' + batch)) return;
      try {
        const { subject, body } = buildDataTransferEmailPreview(batch);
        const payload = await buildDTPayload(batch, subject, body);

        const resp = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload),
          redirect: 'follow'
        });
        const json = await resp.json();
        if (json.error) throw new Error(json.error);

        await metaSet('mailSentDT_' + batch, String(Date.now()));
        renderTable();
      } catch (err) {
        console.error('Auto-send DT failed for ' + batch + ':', err.message);
      }
    }

    // --- FILE POPOVER ---
    const filePopover = document.getElementById('file-popover');
    const fpList = document.getElementById('fp-list');
    const fpTitle = document.getElementById('fp-title');
    const fpDlAll = document.getElementById('fp-dl-all');
    let popoverBatch = null;

    async function openFilePopover(batch, anchorBtn) {
      popoverBatch = batch;
      const names = batchFileMap[batch] || [];

      fpTitle.textContent = `${batch} — ${names.length} file${names.length !== 1 ? 's' : ''}`;
      fpList.innerHTML = names.map(name => `
      <div class="fp-file-item" data-fname="${name}">
        <span style="font-size:1rem;flex-shrink:0">📄</span>
        <span class="fp-file-name" title="${name}">${name}</span>
        <button class="fp-btn-dl"  data-fname="${name}" title="Download">↓</button>
        <button class="fp-btn-del" data-fname="${name}" title="Remove">✕</button>
      </div>`).join('');

      // Position popover anchored to button, clamped within viewport
      filePopover.classList.add('open');
      const rect = anchorBtn.getBoundingClientRect();
      const popW = filePopover.offsetWidth || 260;
      const popH = filePopover.offsetHeight || 300;
      let top = rect.bottom + 6;
      let left = rect.left;
      // Flip above if not enough space below
      if (top + popH > window.innerHeight - 8) top = rect.top - popH - 6;
      // Clamp horizontally
      if (left + popW > window.innerWidth - 8) left = window.innerWidth - popW - 8;
      if (left < 8) left = 8;
      filePopover.style.top = `${Math.max(8, top)}px`;
      filePopover.style.left = `${left}px`;

      // Download individual
      fpList.querySelectorAll('.fp-btn-dl').forEach(btn => {
        btn.addEventListener('click', async e => {
          e.stopPropagation();
          const f = await getSingleBatchFile(popoverBatch, btn.dataset.fname);
          if (f) triggerDownload(f.name, f.data);
        });
      });

      // Remove individual
      fpList.querySelectorAll('.fp-btn-del').forEach(btn => {
        btn.addEventListener('click', async e => {
          e.stopPropagation();
          if (!confirm(`Remove "${btn.dataset.fname}" from ${batch}?`)) return;
          await deleteBatchSingleFile(batch, btn.dataset.fname);
          // Skip Drive re-fetch — local maps already updated.
          renderTable();
          const remaining = batchFileMap[batch] || [];
          if (remaining.length === 0) filePopover.classList.remove('open');
          else openFilePopover(batch, anchorBtn);
        });
      });
    }

    function triggerDownload(name, data) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data]));
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    fpDlAll.addEventListener('click', async () => {
      const names = batchFileMap[popoverBatch] || [];
      for (const name of names) {
        const f = await getSingleBatchFile(popoverBatch, name);
        if (f) triggerDownload(f.name, f.data);
        await new Promise(r => setTimeout(r, 300));
      }
    });

    document.getElementById('fp-rm-all').addEventListener('click', async () => {
      if (!popoverBatch) return;
      if (!confirm(`Remove ALL files for ${popoverBatch}?`)) return;
      const names = [...(batchFileMap[popoverBatch] || [])];
      for (const name of names) {
        await deleteBatchSingleFile(popoverBatch, name);
      }
      // Skip Drive re-fetch — local maps already updated.
      filePopover.classList.remove('open');
      renderTable();
    });

    document.getElementById('fp-close').addEventListener('click', () => filePopover.classList.remove('open'));
    document.addEventListener('click', e => {
      if (!filePopover.contains(e.target)) filePopover.classList.remove('open');
    });

    // --- DOWNLOAD BY BATCH ---
    const downloadWrapper = document.getElementById('download-wrapper');
    const downloadDropdown = document.getElementById('download-dropdown');
    const downloadBatchList = document.getElementById('download-batch-list');

    function populateDownloadDropdown() {
      if (rawData.length === 0) return;
      const batchCol = Object.keys(rawData[0]).find(k => normalize(k).includes('batch'));
      if (!batchCol) return;

      const batches = [...new Set(rawData.map(r => String(r[batchCol] || '')).filter(v => v))]
        .sort((a, b) => {
          const na = parseInt(a.replace(/\D/g, ''), 10), nb = parseInt(b.replace(/\D/g, ''), 10);
          return (isNaN(na) || isNaN(nb)) ? a.localeCompare(b) : nb - na;
        });

      downloadBatchList.innerHTML = batches.map(b =>
        `<div class="download-batch-item" data-batch="${b}">${b}</div>`
      ).join('');

      downloadBatchList.querySelectorAll('.download-batch-item').forEach(el => {
        el.addEventListener('click', () => {
          downloadBatch(el.dataset.batch, batchCol);
          downloadDropdown.classList.remove('open');
        });
      });

      downloadWrapper.style.display = 'block';
      lucide.createIcons();
    }

    function downloadBatch(batchName, batchCol) {
      const rows = rawData.filter(r => String(r[batchCol] || '') === batchName);
      if (rows.length === 0) return;

      const headers = Object.keys(rows[0]);
      const wsData = [headers, ...rows.map(r => headers.map(h => r[h] || ''))];
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(wsData);
      XLSX.utils.book_append_sheet(wb, ws, batchName);
      XLSX.writeFile(wb, `${batchName.replace(/\s+/g, '-')}.xlsx`);
    }

    document.getElementById('btn-download').addEventListener('click', (e) => {
      e.stopPropagation();
      downloadDropdown.classList.toggle('open');
    });

    document.addEventListener('click', () => downloadDropdown.classList.remove('open'));
    document.getElementById('btn-search-trigger').addEventListener('click', () => renderTable());

  </script>
</body>

</html>
